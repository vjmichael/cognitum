name: Cognitum BENCH-02 R3-R1 queue reconciliation, native and original cohorts

on:
  push:
    branches:
      - research/orc-bench02-r3-preregister-20261120

permissions:
  contents: read

concurrency:
  group: cognitum-orcbench02-r3-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-stale-r2:
    name: Retire exact obsolete R2 run before starting R3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel only verified obsolete SHA, require terminal result
        shell: bash
        env:
          REPO: ${{ github.repository }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          repo=os.environ['REPO']
          assert repo == 'vjmichael/cognitum'
          token=os.environ['ACTIONS_TOKEN']
          url=f'https://api.github.com/repos/{repo}/actions/runs/44868881226'
          def query(url, method='GET'):
              request=Request(url, method=method, headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f'Bearer {token}',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'Cognitum-R3-R1-Queue-Reconciliation'})
              with urlopen(request, timeout=15) as response:
                  data=response.read()
                  return json.loads(data) if method=='GET' else response.status
          prior=query(url)
          assert prior['id']==44868881226
          assert prior['head_sha']=='4696144ecd122822de5cddd2cc5f7a28310f704b'
          assert prior['head_branch']=='research/orc-bench02-r2-acquisition-20261120'
          print('Original stale exact-source run:',prior['id'], prior['status'])
          if prior['status']!='completed':
              try:
                  response=query(url+'/cancel', method='POST')
                  assert response==202, 'stale-run cancel was not accepted'
              except HTTPError as ex:
                  if ex.code!=409: raise
              for _ in range(20):
                  time.sleep(3)
                  current=query(url)
                  if current['status']=='completed':break
              else:
                  raise SystemExit('Original stale R2 run remains nonterminal; R3 must not begin')
          final=query(url)
          assert final['status']=='completed','Stale R2 workflow not retired'
          print(json.dumps({'original_run':final['id'],
              'original_sha':final['head_sha'],'status':final['status'],
              'conclusion':final['conclusion']}))
          PY

  native-qualification:
    name: Unchanged source / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: reconcile-stale-r2
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout exact source for all native tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install qualified pytest
        run: python -m pip install pytest==9.0.2
      - name: Qualify original R1 R2 R3 and source acquisition refusal tests
        run: python -m pytest -q tests/test_orc_bench02_availability.py tests/test_orc_bench02_acquisition.py tests/test_orc_bench02_cohorts.py tests/test_orc_bench02_capture_r3.py --junitxml=bench02-r3-r1.xml
      - name: Preserve identical exact source and protocol identities
        shell: bash
        run: |
          git rev-parse HEAD > source-sha.txt
          git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json tools/orcbench02/cohorts.py tests/test_orc_bench02_cohorts.py tools/orcbench02/capture_r3.py tests/test_orc_bench02_capture_r3.py tools/orcbench02/acquisition.py > source-blobs.txt
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          assert sha256(Path('docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json').read_bytes()).hexdigest() == 'fd0b6a372ee5cd9ee8870ad20c475261460a069daf4fd52f56e8dcc2961a5104'
          PY
      - name: Archive all native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench02-r3-r1-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            bench02-r3-r1.xml
            source-sha.txt
            source-blobs.txt
          if-no-files-found: warn

  original-three-stations:
    name: NOAA three frozen original-source sites — no model fitting
    needs: native-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact native-qualified source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.11 for original source retrieval
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make exactly three pre-registered HTTPS source requests
        shell: bash
        run: |
          python -m tools.orcbench02.capture_r3 --output capture-r3 --context "github-run:${{ github.run_id }}:attempt:${{ github.run_attempt }}" > source-summary.json
          git rev-parse HEAD > source-sha.txt
          git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json tools/orcbench02/cohorts.py tools/orcbench02/capture_r3.py > source-blobs.txt
          python - <<'PY'
          from tools.orcbench02.capture_r3 import verify_one
          for site in ('KSEA', 'KDEN', 'KATL'):
              receipt, cohort = verify_one('capture-r3', site)
              assert cohort['no_fitting_or_scoring_performed']
              assert not receipt['production_admission']
              assert not cohort['real_historical_publication_attested']
          PY
      - name: Preserve original data, all source receipts and frozen cohort identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench02-r3-r1-original-KSEA-KDEN-KATL
          path: |
            capture-r3/
            source-summary.json
            source-sha.txt
            source-blobs.txt
          if-no-files-found: warn
