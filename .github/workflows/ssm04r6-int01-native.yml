name: Cognitum SSM R6-INT-01 MEL host journal native acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-ssm04r6-int01-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: MEL SSM R6-INT-01 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin native math, MEL and testing dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 protobuf==6.33.1
      - name: Native original SSM, MEL host admission and transactional journal tests
        run: python -m pytest -q research_tests/ssm04 research_tests/ssm04r1 research_tests/ssm04r2 research_tests/ssm04r3 research_tests/ssm04r4 research_tests/ssm04r5 research_tests/ssm04r6 research_tests/mel03b2/test_admission.py research_tests/mel_ssm_r6int01/test_journal.py --junitxml=ssm04r6-int01-native.xml
      - name: Prove accepted SSM, MEL and new sidecar Git source identities
        shell: bash
        run: |
          git rev-parse HEAD > ssm04r6-int01-source-sha.txt
          git hash-object cognitum/research/ssm_stochastic.py cognitum/research/ssm_stochastic_extended.py cognitum/research/ssm_stochastic_continuous.py cognitum/research/ssm_stochastic_increments.py research_tests/ssm04r2/test_continuous.py research_tests/ssm04r3/test_increments.py cognitum/research/ssm_stochastic_smoothing.py research_tests/ssm04r4/test_correlated_smoothing.py cognitum/research/ssm_stochastic_streaming.py research_tests/ssm04r5/test_streaming.py cognitum/research/ssm_stochastic_checkpoints.py research_tests/ssm04r6/test_checkpoints.py cognitum/mel/admission.py cognitum/mel/ssm_recovery.py research_tests/mel_ssm_r6int01/test_journal.py > ssm04r6-int01-source-blobs.txt
          test "$(git hash-object cognitum/research/ssm_stochastic.py)" = "e6616d14f4b02bd447f872f2a67a444d83bc7df6"
          test "$(git hash-object cognitum/research/ssm_stochastic_extended.py)" = "19aefcc2c01ff629f6da5778b12fa0d495a3b610"
          test "$(git hash-object cognitum/research/ssm_stochastic_continuous.py)" = "026ee4e3b9e4e8be7d0158b9e8771bb691809293"
          test "$(git hash-object cognitum/research/ssm_stochastic_increments.py)" = "3eebcec1da8bae1cb3a65d33aab389c584cff89b"
          test "$(git hash-object research_tests/ssm04r2/test_continuous.py)" = "8b8b16a9f3a3355cadd8ac7b19bf05af097e737a"
          test "$(git hash-object research_tests/ssm04r3/test_increments.py)" = "ee311ead4b017e0e080f41cf412d22bfff0139b3"
          test "$(git hash-object cognitum/research/ssm_stochastic_smoothing.py)" = "bc657af3ba28474c72bbb34376739f6bdef82106"
          test "$(git hash-object research_tests/ssm04r4/test_correlated_smoothing.py)" = "f9cc09a3a54308135d6f25f63904d18d0d3ff6f8"
          test "$(git hash-object cognitum/research/ssm_stochastic_streaming.py)" = "731208b392d3a948ee7677c2e24f1117e2c8df79"
          test "$(git hash-object research_tests/ssm04r5/test_streaming.py)" = "826e1a7402cf89ae5c8855cbe52fd8280617c73a"
          test "$(git hash-object cognitum/research/ssm_stochastic_checkpoints.py)" = "30773bfaf4871bf686df0690419e3244c380be03"
          test "$(git hash-object research_tests/ssm04r6/test_checkpoints.py)" = "23ae54dc6a8c47e2230df98af58d4eba3808ba77"
          test "$(git hash-object cognitum/mel/admission.py)" = "405fa91935f62226ab0d1a2f0d8b7313e2327116"
          test "$(git hash-object cognitum/mel/ssm_recovery.py)" = "8d326324c4cca3706b977ec687583efcd5716c26"
          test "$(git hash-object research_tests/mel_ssm_r6int01/test_journal.py)" = "ba7cb4a29908e433d26840d7d5f8b51738d3bb1d"
          test "$(git hash-object cognitum/research/ssm_stochastic.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_extended.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_extended.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_continuous.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_continuous.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_increments.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_increments.py")"
          test "$(git hash-object research_tests/ssm04r2/test_continuous.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r2/test_continuous.py")"
          test "$(git hash-object research_tests/ssm04r3/test_increments.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r3/test_increments.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_smoothing.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_smoothing.py")"
          test "$(git hash-object research_tests/ssm04r4/test_correlated_smoothing.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r4/test_correlated_smoothing.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_streaming.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_streaming.py")"
          test "$(git hash-object research_tests/ssm04r5/test_streaming.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r5/test_streaming.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_checkpoints.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_checkpoints.py")"
          test "$(git hash-object research_tests/ssm04r6/test_checkpoints.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r6/test_checkpoints.py")"
          test "$(git hash-object cognitum/mel/admission.py)" = "$(git rev-parse "HEAD:cognitum/mel/admission.py")"
          test "$(git hash-object cognitum/mel/ssm_recovery.py)" = "$(git rev-parse "HEAD:cognitum/mel/ssm_recovery.py")"
          test "$(git hash-object research_tests/mel_ssm_r6int01/test_journal.py)" = "$(git rev-parse "HEAD:research_tests/mel_ssm_r6int01/test_journal.py")"
      - name: Preserve original JUnit, commit and fifteen immutable source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitum-ssm04r6-int01-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ssm04r6-int01-native.xml
            ssm04r6-int01-source-sha.txt
            ssm04r6-int01-source-blobs.txt
          if-no-files-found: warn

  independent:
    name: Reconcile four original JUnits, MEL/SSM Git blobs and source identity
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cognitum-ssm04r6-int01-*
          path: original-native-evidence
          merge-multiple: false
      - name: Independently compare original JUnit classes, Git blobs and exact source SHA
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('original-native-evidence')
          expected={f'cognitum-ssm04r6-int01-{platform}-py{version}'
                   for platform in ('ubuntu-latest','windows-latest')
                   for version in ('3.11','3.13')}
          assert {p.name for p in root.iterdir() if p.is_dir()} == expected
          expected_hashes=["e6616d14f4b02bd447f872f2a67a444d83bc7df6","19aefcc2c01ff629f6da5778b12fa0d495a3b610","026ee4e3b9e4e8be7d0158b9e8771bb691809293","3eebcec1da8bae1cb3a65d33aab389c584cff89b","8b8b16a9f3a3355cadd8ac7b19bf05af097e737a","ee311ead4b017e0e080f41cf412d22bfff0139b3","bc657af3ba28474c72bbb34376739f6bdef82106","f9cc09a3a54308135d6f25f63904d18d0d3ff6f8","731208b392d3a948ee7677c2e24f1117e2c8df79","826e1a7402cf89ae5c8855cbe52fd8280617c73a","30773bfaf4871bf686df0690419e3244c380be03","23ae54dc6a8c47e2230df98af58d4eba3808ba77","405fa91935f62226ab0d1a2f0d8b7313e2327116","8d326324c4cca3706b977ec687583efcd5716c26","ba7cb4a29908e433d26840d7d5f8b51738d3bb1d"]
          common=None
          counts={}
          integrated={}
          for directory in sorted(root.iterdir()):
              assert directory.is_dir()
              assert (directory/'ssm04r6-int01-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
              assert (directory/'ssm04r6-int01-source-blobs.txt').read_text().splitlines()==expected_hashes
              cases=list(ET.parse(directory/'ssm04r6-int01-native.xml').getroot().iter('testcase'))
              assert len(cases)>=222, (directory.name,len(cases))
              assert not any(c.find(name) is not None for c in cases
                             for name in ('failure','error','skipped'))
              identities=sorted((c.get('classname'),c.get('name')) for c in cases)
              assert len(set(identities))==len(identities)
              adapter_count=sum('mel_ssm_r6int01' in cls for cls,name in identities)
              assert adapter_count>=23, (directory.name,adapter_count)
              if common is None:common=identities
              else:assert common==identities
              counts[directory.name]=len(cases)
              integrated[directory.name]=adapter_count
          receipt=dict(schema='cognitum.ssm04r6int01.four_native_original_evidence.v1',
              status='PASS_HOST_MEL_JOURNAL_MATH_RECOVERY_AND_ORIGINAL_SOURCES',
              original_source_sha=os.environ['SOURCE_SHA'],
              tests_per_native_platform=counts,
              integration_cases_per_native_platform=integrated,
              original_15_git_blobs_identical=True,
              original_JUnit_test_identities_identical=True,
              OS_protected_key_broker_installed=False,
              installed_MEL_SSM_runtime_route_authorized=False,
              transactional_external_delivery_qualified=False)
          Path('ssm04r6-int01-independent.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve independent evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitum-ssm04r6-int01-independent
          path: ssm04r6-int01-independent.json
          if-no-files-found: warn
