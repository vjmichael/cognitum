name: Cognitum BENCH-02 R4-R2-R3 portable original Orc refusal qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-orc-bench02-r4r2r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-portable:
    name: Native source, selection, specialist and original results / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact unchanged original NOAA, accepted R4 and portable successor
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native Python matrix
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin original numerical/protobuf and qualification dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 protobuf==6.33.1 pytest==9.0.2
      - name: Original Orc regressions, source/science R3 and R4, original native R4R2 and portable pretests
        run: python -m pytest -q tests/test_orc_science_data.py tests/test_orc_comparison.py tests/test_orc_selection.py tests/test_orc_real_benchmark.py tests/test_orc_bench02_availability.py tests/test_orc_bench02_acquisition.py tests/test_orc_bench02_cohorts.py tests/test_orc_bench02_capture_r3.py tests/test_orc_bench02_r4_pretest.py tests/test_orc_bench02_r4r2_pretest.py tests/test_orc_bench02_r4r2r3_pretest.py --junitxml=bench02-r4r2r3-pretest.xml
      - name: Original native SSM KAN HDC and original Orc selection freeze before heldout scoring
        run: python -m tools.orcbench02.portable_r4r2r3 --phase freeze --decisions bench02-r4r2r3-decisions.json
      - name: Reproduce source and original calibration decisions then score heldout without selection repair
        run: python -m tools.orcbench02.portable_r4r2r3 --phase score --decisions bench02-r4r2r3-decisions.json --results bench02-r4r2r3-results.json
      - name: Independently replay every original source-bound forecast and near-tie refusal
        run: python -m pytest -q tests/test_orc_bench02_r4r2r3_results.py --junitxml=bench02-r4r2r3-verified.xml
      - name: Record exact original source SHA and Git blob identities with CRLF refusal
        shell: bash
        run: |
          git rev-parse HEAD > source-sha.txt
          git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_R3_PREREG.json docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_R3_RECEIPT_AMENDMENT.json cognitum/orc_selection.py cognitum/orc_comparison.py cognitum/research/kan_trainable.py cognitum/research/hdc_algebra.py cognitum/research/hdc_associative.py tools/orcbench02/portable_r4r2r3.py tools/orcbench02/portable_verify_r4r2r3.py tests/test_orc_bench02_r4r2r3_pretest.py tests/test_orc_bench02_r4r2r3_results.py docs/research/orcgraph/ORCH01E_BENCH02_R4.md docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_NATIVE_ARTIFACTS.json > source-blobs.txt
          test "$(git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_R3_PREREG.json)" = "dcfc11361bee51507cbdbe99f73652755023eb27"
          test "$(git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_R3_RECEIPT_AMENDMENT.json)" = "d62a05fabbbe5aa7490d046f20382f24d7973d0f"
          test "$(git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R4.md)" = "5dc4fa1f980fc7678371cba78dbfdbdfe09fb651"
          test "$(git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_NATIVE_ARTIFACTS.json)" = "194275093e91a96909abe7efd61b951d057099f1"
          for file in docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_R3_PREREG.json docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_R3_RECEIPT_AMENDMENT.json cognitum/orc_selection.py cognitum/orc_comparison.py cognitum/research/kan_trainable.py cognitum/research/hdc_algebra.py cognitum/research/hdc_associative.py tools/orcbench02/portable_r4r2r3.py tools/orcbench02/portable_verify_r4r2r3.py tests/test_orc_bench02_r4r2r3_pretest.py tests/test_orc_bench02_r4r2r3_results.py docs/research/orcgraph/ORCH01E_BENCH02_R4.md docs/research/orcgraph/ORCH01E_BENCH02_R4_R2_NATIVE_ARTIFACTS.json; do
            test "$(git hash-object "$file")" = "$(git rev-parse "HEAD:$file")" || { echo "Refusing mutated original source: $file"; exit 1; }
          done
      - name: Archive every original frozen decision, native forecast, source receipt and test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbench02-r4r2r3-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            bench02-r4r2r3-pretest.xml
            bench02-r4r2r3-verified.xml
            bench02-r4r2r3-decisions.json
            bench02-r4r2r3-results.json
            source-blobs.txt
            source-sha.txt
          if-no-files-found: warn

  cross-native-original:
    name: Independent 4-platform full original source and portable numeric reconciliation
    needs: [native-portable]
    if: ${{ always() && needs.native-portable.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Same exact native source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python independent standard-library verifier
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent verifier's pinned numerical and source-protobuf imports
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 protobuf==6.33.1
      - name: Retrieve original four native JUnit and source-bounded numerical archives
        uses: actions/download-artifact@v4
        with:
          pattern: orcbench02-r4r2r3-*
          path: native-artifacts
          merge-multiple: false
      - name: Independently compare all original four platforms and source-bound numerical tolerances
        run: python -m tools.orcbench02.portable_verify_r4r2r3 --root native-artifacts --expected-sha ${{ github.sha }} --output bench02-r4r2r3-cross-native-receipt.json
      - name: Preserve independently derived four-native receipt even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbench02-r4r2r3-independent-four-native
          path: bench02-r4r2r3-cross-native-receipt.json
          if-no-files-found: warn
