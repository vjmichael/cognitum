name: Cognitum C01-C19 integration and release source gate

on:
  pull_request:
    paths:
      - 'cognitum/**'
      - 'tests/**'
      - 'tools/**'
      - 'proto/**'
      - 'pyproject.toml'
      - '.github/workflows/cognitum-integration-closeout.yml'
  push:
    branches:
      - main
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-tree:
    name: Combined tree / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real maintained baseline optional dependencies
        run: python -m pip install -e ".[security,scientific,causal-stats,planning-graph,planning-validation,research-hdc-kan]" "grpcio-tools>=1.70,<2" "pytest>=9,<10" "jsonschema>=4,<5"
      - name: Check dependency constraints and source compilation
        run: |
          python -m pip check
          python -m compileall -q cognitum tests tools
      - name: Cross-platform common-tree unit regression with explicit OS ownership
        run: python -m tools.run_crossplatform_regression
      - name: Detect C01-C19 integration gaps without claiming release readiness
        run: python -m tools.cognitum_integration_source_gate --report integration-artifacts/source-inventory.json
      - name: Strict 19-component source convergence gate
        run: python -m tools.cognitum_integration_source_gate --require-sources --report integration-artifacts/source-strict.json
      - name: Upload source status even when missing components block release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-${{ matrix.os }}-py${{ matrix.python-version }}
          path: integration-artifacts/
          if-no-files-found: warn
          retention-days: 14
