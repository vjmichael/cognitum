name: Cognitum Lu IPC-01E-R1 native R6 outbox and Lu durable source assurance

on:
  push:
    branches:
      - integration/cog-lu-ipc01e-r1-outbox-20261121
    paths:
      - '.github/workflows/cog-lu-ipc01e-r1-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cog-lu-ipc01e-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Cognitum outbox lifecycle / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked genuine Protobuf and scientific dependencies
        run: python -m pip install grpcio-tools==1.76.0 protobuf==6.33.1 numpy==2.2.6 scipy==1.15.3 pytest==9.0.2
      - name: Independently compile pinned Lu workspace and Cognitum SSM Protobuf
        shell: bash
        run: |
          python -m research_tests.mel_lu_ipc01c.compile_pinned_lu_ssm \
            --root "$GITHUB_WORKSPACE/cognitum/mel/vendor" \
            --descriptor-out "$GITHUB_WORKSPACE/lu-cog-ssm-v1.desc" \
            --receipt "$GITHUB_WORKSPACE/lu-cog-ssm-v1-native.json"
      - name: Original 01A-01D regressions and 01E full native R6/Lu outbox tests
        run: python -m pytest -q research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py research_tests/mel_lu_ipc01b/test_native_carriers.py research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py research_tests/mel_lu_ipc01d/test_durable_lifecycle.py research_tests/mel_lu_ipc01e/test_outbox_reconcile.py --junitxml=cog-lu-ipc01e-r1-native.xml
      - name: Record exact source SHA and 20 original Git blob identities
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > cog-lu-ipc01e-r1-source-sha.txt
          git hash-object cognitum/mel/vendor/lu/workspace/v0/workspace.proto cognitum/mel/vendor/cognitum/ssm/v1/ssm.proto cognitum/mel/lu_workspace_contract.py cognitum/mel/lu_adapter.py cognitum/mel/lu_ipc_readonly.py cognitum/mel/lu_ipc_native.py cognitum/mel/lu_ssm_contract.py cognitum/mel/lu_ipc_lifecycle.py cognitum/mel/lu_ipc_outbox.py cognitum/mel/ssm_recovery.py cognitum/mel/admission.py research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py research_tests/mel_lu_ipc01b/test_native_carriers.py research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py research_tests/mel_lu_ipc01c/compile_pinned_lu_ssm.py research_tests/mel_lu_ipc01d/test_durable_lifecycle.py research_tests/mel_lu_ipc01e/test_outbox_reconcile.py .gitattributes docs/integration/COG_LU_IPC_01E_R1_OUTBOX.md > cog-lu-ipc01e-r1-source-blobs.txt
          test "$(git hash-object cognitum/mel/vendor/lu/workspace/v0/workspace.proto)" = "4e01d921197fb1c58c99958479b1cede36e13c9a"
          test "$(git hash-object cognitum/mel/vendor/cognitum/ssm/v1/ssm.proto)" = "755562254afdbea686ee33b95567c505f2f85e49"
          test "$(git hash-object cognitum/mel/lu_workspace_contract.py)" = "ac57eb0afc4b2f0630531470e067461d8e2268ea"
          test "$(git hash-object cognitum/mel/lu_adapter.py)" = "300300b9f63f417afcc0ec650697e3012b7bdab0"
          test "$(git hash-object cognitum/mel/lu_ipc_readonly.py)" = "b21612457c3763dab8233d0eced5e5fffca968ad"
          test "$(git hash-object cognitum/mel/lu_ipc_native.py)" = "7c70333ddbe85fc187e6b1d5ba9956abca4c5a58"
          test "$(git hash-object cognitum/mel/lu_ssm_contract.py)" = "01ec228aa1ac1417c77d7a444f3c27a32b632e1c"
          test "$(git hash-object cognitum/mel/lu_ipc_lifecycle.py)" = "3e644716fe96a0e48aef39e7eaefafa8b5ed6254"
          test "$(git hash-object cognitum/mel/lu_ipc_outbox.py)" = "14fa22acd34f72e2df080d23b52e18a289a1cd1a"
          test "$(git hash-object cognitum/mel/ssm_recovery.py)" = "d9ca61ce225e90855b2bfba42f98abf78a7d3276"
          test "$(git hash-object cognitum/mel/admission.py)" = "405fa91935f62226ab0d1a2f0d8b7313e2327116"
          test "$(git hash-object research_tests/mel_lu_ipc01a/test_workspace_contract.py)" = "05e40e09c7a3e9bfdf838d38f4e971682ec8cfd2"
          test "$(git hash-object research_tests/mel_lu_ipc01a/test_proto_client.py)" = "64ca56b974d8b0d0b5e3d566e8c0c5bab36ee474"
          test "$(git hash-object research_tests/mel_lu_ipc01b/test_native_carriers.py)" = "8d0e1774c3ba7d697b3fc6190295271f81b76e80"
          test "$(git hash-object research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py)" = "dc1af1130a6d5f37cf18c6a20b44ad09be251fc0"
          test "$(git hash-object research_tests/mel_lu_ipc01c/compile_pinned_lu_ssm.py)" = "c4a50016415af98509ac9fe7d0283b2c513ee29a"
          test "$(git hash-object research_tests/mel_lu_ipc01d/test_durable_lifecycle.py)" = "65b3470a4e7622b2e7c057a059009c66f730f181"
          test "$(git hash-object research_tests/mel_lu_ipc01e/test_outbox_reconcile.py)" = "139a2307ab96d47bba9a4d6b080b0aec2d0a9732"
          test "$(git hash-object .gitattributes)" = "f475ae5dffefa219891604df8acae665de8c102a"
          test "$(git hash-object docs/integration/COG_LU_IPC_01E_R1_OUTBOX.md)" = "bc94a9b35dbf5957df510a9433f67639575503ae"
      - name: Archive original native JUnit and Protobuf receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog-lu-ipc01e-r1-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            cog-lu-ipc01e-r1-native.xml
            cog-lu-ipc01e-r1-source-sha.txt
            cog-lu-ipc01e-r1-source-blobs.txt
            lu-cog-ssm-v1.desc
            lu-cog-ssm-v1-native.json
            cognitum/mel/vendor/lu/workspace/v0/workspace_pb2.py
            cognitum/mel/vendor/cognitum/ssm/v1/ssm_pb2.py
          if-no-files-found: warn

  independent:
    name: Independent exact original 4 native JUnit and 20 source pin audit
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cog-lu-ipc01e-r1-*
          path: original-native
          merge-multiple: false
      - name: Compare original four native receipt families and no-install claims
        shell: bash
        env:
          EXACT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,xml.etree.ElementTree as ET
          root=Path("original-native")
          wanted={f"cog-lu-ipc01e-r1-{platform}-py{py}"
                  for platform in ("windows-latest","ubuntu-latest")
                  for py in ("3.11","3.13")}
          assert {x.name for x in root.iterdir() if x.is_dir()}==wanted
          pins=["4e01d921197fb1c58c99958479b1cede36e13c9a","755562254afdbea686ee33b95567c505f2f85e49","ac57eb0afc4b2f0630531470e067461d8e2268ea","300300b9f63f417afcc0ec650697e3012b7bdab0","b21612457c3763dab8233d0eced5e5fffca968ad","7c70333ddbe85fc187e6b1d5ba9956abca4c5a58","01ec228aa1ac1417c77d7a444f3c27a32b632e1c","3e644716fe96a0e48aef39e7eaefafa8b5ed6254","14fa22acd34f72e2df080d23b52e18a289a1cd1a","d9ca61ce225e90855b2bfba42f98abf78a7d3276","405fa91935f62226ab0d1a2f0d8b7313e2327116","05e40e09c7a3e9bfdf838d38f4e971682ec8cfd2","64ca56b974d8b0d0b5e3d566e8c0c5bab36ee474","8d0e1774c3ba7d697b3fc6190295271f81b76e80","dc1af1130a6d5f37cf18c6a20b44ad09be251fc0","c4a50016415af98509ac9fe7d0283b2c513ee29a","65b3470a4e7622b2e7c057a059009c66f730f181","139a2307ab96d47bba9a4d6b080b0aec2d0a9732","f475ae5dffefa219891604df8acae665de8c102a","bc94a9b35dbf5957df510a9433f67639575503ae"]
          match=None
          receipts={}
          for folder in sorted(root.iterdir()):
              assert (folder/"cog-lu-ipc01e-r1-source-sha.txt").read_text().strip()==os.environ["EXACT_SHA"]
              assert (folder/"cog-lu-ipc01e-r1-source-blobs.txt").read_text().splitlines()==pins
              meta=json.loads((folder/"lu-cog-ssm-v1-native.json").read_text())
              assert meta["exact_lu_workspace_proto_preserved"]
              assert meta["cognitum_domain_proto_compiled"]
              assert not meta["live_registration_authorized"]
              assert not meta["genuine_installed_lu_core_connected"]
              assert meta["exact_owner_sources"]["lu/workspace/v0/workspace.proto"]["git_blob_sha"]==pins[0]
              assert meta["exact_owner_sources"]["cognitum/ssm/v1/ssm.proto"]["git_blob_sha"]==pins[1]
              assert hashlib.sha256((folder/"lu-cog-ssm-v1.desc").read_bytes()).hexdigest()==meta["composite_descriptor_sha256"]
              for relative in ("lu/workspace/v0/workspace.proto","cognitum/ssm/v1/ssm.proto"):
                  py=folder/("cognitum/mel/vendor/"+relative.replace(".proto","_pb2.py"))
                  assert hashlib.sha256(py.read_bytes()).hexdigest()==meta["generated_python_sha256"][relative]
              cases=list(ET.parse(folder/"cog-lu-ipc01e-r1-native.xml").getroot().iter("testcase"))
              assert len(cases)>=155,(folder.name,len(cases))
              assert not any(c.find(tag) is not None for c in cases for tag in ("failure","error","skipped"))
              ids=sorted((c.get("classname"),c.get("name")) for c in cases)
              assert len(ids)==len(set(ids))
              assert sum("mel_lu_ipc01e" in (c.get("classname") or "") for c in cases)>=20
              shape=(ids,meta["composite_descriptor_sha256"],
                     tuple(sorted(meta["generated_python_sha256"].items())))
              if match is None:match=shape
              else:assert match==shape
              receipts[folder.name]=len(cases)
          assert len(set(receipts.values()))==1
          evidence=dict(schema="cognitum.lu_ipc01e_r1.original_native_evidence.v1",
              status="PASS_SOURCE_ONLY_R6_LU_OUTBOX_LIFECYCLE",
              qualified_sha=os.environ["EXACT_SHA"],native_cases=receipts,
              exact_20_pinned_blobs_and_descriptor_identical=True,
              four_original_JUnit_case_sets_identical=True,
              signed_Lu_Core_provenance_qualified=False,
              installed_OS_credential_custody_qualified=False,
              independent_hardware_monotonic_anchor_qualified=False,
              worker_cancellation_effect_proven=False,
              model_tool_invocation_authorized=False,
              outbox_ack_or_delivery_authorized=False)
          Path("cog-lu-ipc01e-r1-independent.json").write_text(
              json.dumps(evidence,sort_keys=True,indent=2)+"\n")
          print(json.dumps(evidence,sort_keys=True))
          PY
      - name: Preserve independent fifth original source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog-lu-ipc01e-r1-independent
          path: cog-lu-ipc01e-r1-independent.json
          if-no-files-found: warn
