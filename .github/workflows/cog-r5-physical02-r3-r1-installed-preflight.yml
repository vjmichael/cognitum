name: Cognitum R3-R1 installed custody negative preflight
on:
  push:
    branches: [integration/cog-lu-ipc01e-r2-custody-20261121]
    paths:
      - .github/workflows/cog-r5-physical02-r3-r1-installed-preflight.yml
      - scripts/cog-r5-physical02-r3-r1-runtime-audit.ps1
      - scripts/cog-r5-physical02-r3-r1-installed-preflight.ps1
      - scripts/cog-r5-physical02-r3-r1-signed-installer.ps1
      - scripts/cog-r5-physical02-r3-r1-enroll-production.ps1
      - native/windows_scm_production/src/main.rs
      - native/windows_scm_production/Cargo.toml
      - native/windows_scm_production/Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-deny:
    name: Protected manifest and unsigned production refusal
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify syntax and read-only admission code
        shell: pwsh
        run: |
          foreach($p in @('scripts/cog-r5-physical02-r3-r1-runtime-audit.ps1','scripts/cog-r5-physical02-r3-r1-installed-preflight.ps1','scripts/cog-r5-physical02-r3-r1-signed-installer.ps1','scripts/cog-r5-physical02-r3-r1-enroll-production.ps1')){
            $tokens=$null
            $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -ne 0){throw 'Read-only installed script has syntax error'}
          }
      - name: Compile distinct genuine no-worker production SCM bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='native/windows_scm_production'
          cargo build --manifest-path "$root/Cargo.toml" --release --locked --offline
          if($LASTEXITCODE -ne 0){throw 'Distinct genuine production SCM bootstrap compile failed'}
          $exe=Join-Path "$root/target/release" 'cognitum-scm-production.exe'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Original separately compiled production image unavailable'}
          $fixture=Join-Path 'native/windows_scm_fixture/target/release' 'cognitum-scm-supervisor.exe'
          if(Test-Path $fixture){throw 'Production bootstrap workflow compiled a CI fixture unexpectedly'}
          $text=Get-Content -LiteralPath "$root/src/main.rs" -Raw
          foreach($s in @('COG_R1_CI_MAC_KEY_HEX','CognitumSsmNativeFixtureV1','--cognitum-fixed-custody-child','COG_R3_CI_PEER_PID')){
            if($text.Contains($s)){throw 'Production SCM bootstrap includes CI-only credential/worker'}
          }
          if(-not $text.Contains('CognitumSsmSupervisorV1')){throw 'Production SCM service identity absent'}
          Write-Host 'PASS_NATIVE_SEPARATE_PRODUCTION_NO_WORKER_SCM_SOURCE_BUILD_ONLY'
      - name: Native pre-staged protected file integrity and negative cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $audit='./scripts/cog-r5-physical02-r3-r1-runtime-audit.ps1'
          $prefix=Join-Path $env:RUNNER_TEMP ('cog-r3r1-sealed-'+$env:GITHUB_RUN_ID)
          $runnerSid=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          function Denied([scriptblock]$check){
            $refused=$false
            try{& $check|Out-Null}catch{
              if($_.Exception.Message -match 'COG_R3R1_INSTALLED_RUNTIME_REFUSED'){
                $refused=$true
              }else{throw}
            }
            if(-not $refused){throw 'Untrusted frozen installed file set passed audit'}
          }
          function New-ProtectedCase([string]$name,[string]$kind){
            $caseRoot=$prefix+'-'+$name
            $runtime=Join-Path $caseRoot 'runtime'
            New-Item -ItemType Directory -Path $runtime -Force|Out-Null
            $empty=Join-Path $runtime '__init__.py'
            $code=Join-Path $runtime 'a.py'
            [IO.File]::WriteAllBytes($empty,[byte[]]@())
            [IO.File]::WriteAllText($code,'print(1)',[Text.Encoding]::ASCII)
            $h0=(Get-FileHash $empty -Algorithm SHA256).Hash.ToLowerInvariant()
            $h1=(Get-FileHash $code -Algorithm SHA256).Hash.ToLowerInvariant()
            $tab=[string][char]9
            $lf=[string][char]10
            $manifest=Join-Path $runtime 'r3-r1-runtime.manifest'
            [IO.File]::WriteAllText($manifest,($h0+$tab+'__init__.py'+$lf+$h1+$tab+'a.py'+$lf),[Text.Encoding]::ASCII)
            $pin=(Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
            $provenance=Join-Path $runtime 'r3-r1-runtime-provenance.json'
            $schema=if($kind -eq 'ci'){ 'cognitum.ssm.r3r1.test_installer_style_frozen_runtime.v1' }else{'cognitum.ssm.r3r1.production_installer_runtime.v1'}
            $record=[ordered]@{schema=$schema;runtime_manifest_sha256=$pin}
            [IO.File]::WriteAllText($provenance,($record|ConvertTo-Json -Compress),[Text.Encoding]::ASCII)
            $ppin=(Get-FileHash $provenance -Algorithm SHA256).Hash.ToLowerInvariant()
            # This deliberately invalid MSI is still a real on-disk artifact:
            # verify rejection is due to its absent trusted publisher, not
            # simply because a nonexistent path was supplied.
            $unsigned=Join-Path $caseRoot 'untrusted.msi'
            [IO.File]::WriteAllBytes($unsigned,[byte[]]::new(2048))
            $unsignedPin=(Get-FileHash $unsigned -Algorithm SHA256).Hash.ToLowerInvariant()
            # Construct all adversarial bytes while the fixture is mutable.
            # Never grant the runner write access after the file set is sealed.
            if($kind -eq 'tampered'){
              [IO.File]::WriteAllText($code,'print(2)',[Text.Encoding]::ASCII)
            }
            if($kind -eq 'extra'){
              [IO.File]::WriteAllText((Join-Path $runtime 'rogue.py'),'pass',[Text.Encoding]::ASCII)
            }
            if($kind -ne 'unprotected'){
              # Per-file explicit trusted write ACEs FIRST; then owner; only
              # then drop inherited writable runner ACEs. The runner receives
              # read/execute so it can audit, not modify, the sealed files.
              & icacls.exe $caseRoot /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' /T /C /Q |Out-Null
              if($LASTEXITCODE -ne 0){throw 'Trusted per-file ACE setup failed'}
              & icacls.exe $caseRoot /setowner '*S-1-5-32-544' /T /C /Q |Out-Null
              if($LASTEXITCODE -ne 0){throw 'Trusted per-file ownership setup failed'}
              & icacls.exe $caseRoot /grant ('*'+$runnerSid+':(OI)(CI)RX') /T /C /Q |Out-Null
              if($LASTEXITCODE -ne 0){throw 'Read-only audit ACE setup failed'}
              & icacls.exe $caseRoot /inheritance:r /T /C /Q |Out-Null
              if($LASTEXITCODE -ne 0){throw 'Inherited runner write ACE elimination failed'}
            }
            return [pscustomobject]@{Home=$caseRoot;Runtime=$runtime;ManifestPin=$pin;ProvenancePin=$ppin;UnsignedPin=$unsignedPin}
          }
          $good=New-ProtectedCase 'valid' 'valid'
          $tampered=New-ProtectedCase 'tamper' 'tampered'
          $unlisted=New-ProtectedCase 'extra' 'extra'
          $ci=New-ProtectedCase 'ci' 'ci'
          $unprotected=New-ProtectedCase 'unprotected' 'unprotected'
          $observed=& $audit -ApprovedInstallRoot $good.Home -RuntimeRoot $good.Runtime -ApprovedManifestSha256 $good.ManifestPin -ApprovedProvenanceSha256 $good.ProvenancePin|ConvertFrom-Json
          if($observed.status -cne 'PASS_INSTALLED_RUNTIME_DIGEST_ACL_OBSERVATION_ONLY' -or
             $observed.original_file_count -ne 2 -or $observed.production_installer_verified -ne $false -or
             $observed.output_release_authorized -ne $false){
            throw 'Protected synthetic manifest observation not bounded and read-only'
          }
          Denied {& $audit -ApprovedInstallRoot $good.Home -RuntimeRoot $good.Runtime -ApprovedManifestSha256 ('0'*64) -ApprovedProvenanceSha256 $good.ProvenancePin}
          Denied {& $audit -ApprovedInstallRoot $good.Home -RuntimeRoot $good.Runtime -ApprovedManifestSha256 $good.ProvenancePin -ApprovedProvenanceSha256 $good.ProvenancePin}
          Denied {& $audit -ApprovedInstallRoot $tampered.Home -RuntimeRoot $tampered.Runtime -ApprovedManifestSha256 $tampered.ManifestPin -ApprovedProvenanceSha256 $tampered.ProvenancePin}
          Denied {& $audit -ApprovedInstallRoot $unlisted.Home -RuntimeRoot $unlisted.Runtime -ApprovedManifestSha256 $unlisted.ManifestPin -ApprovedProvenanceSha256 $unlisted.ProvenancePin}
          Denied {& $audit -ApprovedInstallRoot $ci.Home -RuntimeRoot $ci.Runtime -ApprovedManifestSha256 $ci.ManifestPin -ApprovedProvenanceSha256 $ci.ProvenancePin}
          Denied {& $audit -ApprovedInstallRoot $unprotected.Home -RuntimeRoot $unprotected.Runtime -ApprovedManifestSha256 $unprotected.ManifestPin -ApprovedProvenanceSha256 $unprotected.ProvenancePin}
          $noUnsignedPromotion=$false
          try{
            & ./scripts/cog-r5-physical02-r3-r1-installed-preflight.ps1 -SignedInstallerPackage (Join-Path $good.Home 'untrusted.msi') -ApprovedInstallerSha256 $good.UnsignedPin -InstalledExecutable (Join-Path $good.Home 'CognitumSsmNativeFixtureV1.exe') -ApprovedInstallRoot $good.Home -ApprovedImageSha256 $good.ManifestPin -ApprovedSignerCertificateSha256 $good.ManifestPin -RuntimeRoot $good.Runtime -ApprovedRuntimeManifestSha256 $good.ManifestPin -ApprovedRuntimeProvenanceSha256 $good.ProvenancePin|Out-Null
          }catch{
            if($_.Exception.Message -notmatch 'COG_R3R1_SIGNED_PACKAGE_REFUSED'){
              throw 'Unexpected installed gate failure; unsigned Authenticode refusal not independently proven'
            }
            $noUnsignedPromotion=$true
          }
          if(-not $noUnsignedPromotion){throw 'CI-only/uninstalled SCM identity promoted to production'}
          # These are disposable hosted-runner test roots. Never restore write
          # access or mutate the sealed source to make negative tests pass.
          Write-Host 'PASS_CI_ONLY_PRESTAGED_PROTECTED_RUNTIME_AND_UNSIGNED_HOST_REFUSAL'
