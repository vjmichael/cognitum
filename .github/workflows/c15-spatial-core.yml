name: C15 complete practical spatial design native acceptance
on:
  push:
    paths:
      - 'cognitum/spatial_*.py'
      - 'cognitum/spatial_tracking.py'
      - 'cognitum/spatial_core_wire.py'
      - 'cognitum/proto/spatial_core_pb2.py'
      - 'proto/cognitum/spatial_core/v1/**'
      - 'tests/test_c15_spatial_*.py'
      - 'tests/test_c15_full_design.py'
      - 'tests/test_c15_lifecycle_appearance.py'
      - 'tools/c15_spatial_benchmark.py'
      - 'tools/c15_full_design_benchmark.py'
      - 'pyproject.toml'
      - '.github/workflows/c15-spatial-core.yml'
  pull_request:
    paths:
      - 'cognitum/spatial_*.py'
      - 'cognitum/spatial_tracking.py'
      - 'cognitum/spatial_core_wire.py'
      - 'cognitum/proto/spatial_core_pb2.py'
      - 'proto/cognitum/spatial_core/v1/**'
      - 'tests/test_c15_spatial_*.py'
      - 'tests/test_c15_full_design.py'
      - 'tests/test_c15_lifecycle_appearance.py'
      - 'tools/c15_spatial_benchmark.py'
      - 'tools/c15_full_design_benchmark.py'
      - 'pyproject.toml'
      - '.github/workflows/c15-spatial-core.yml'
  workflow_dispatch:

jobs:
  spatial-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual SciPy Hungarian and geometry kernels
        run: python -m pip install -e ".[spatial-vision]" grpcio-tools
      - name: Require installed native backend
        run: |
          python -m pip check
          python -c "import numpy,scipy; from scipy.optimize import linear_sum_assignment; from scipy.spatial.transform import Rotation; print('SciPy',scipy.__version__)"
      - name: Independent Protobuf compiler/checked-in binding parity
        run: |
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled-c15-core.pb proto/cognitum/spatial_core/v1/spatial_core.proto
          python tools/check_proto_descriptors.py compiled-c15-core.pb
      - name: C15 geometry, occlusion, tracking and wire regression
        run: python -W error -m unittest discover -s tests -p "test_c15_spatial_*.py" -v
      - name: Fixed-synthetic-scene native SciPy identity benchmark
        run: python tools/c15_spatial_benchmark.py
      - name: Stable scene aliases, SQLite recovery, and appearance adversarial tests
        run: |
          python -W error -m unittest discover -s tests -p "test_c15_lifecycle_appearance.py" -v
          python -W error -m unittest discover -s tests -p "test_c15_full_design.py" -v
      - name: Measured matched geometry and appearance challenger benchmark
        run: python tools/c15_full_design_benchmark.py
      - name: Verify standalone imported MOT diagnostic and external TrackEval refusal paths
        run: |
          python -W error -m unittest discover -s tests -p "test_c15_spatial_mot_diagnostics.py" -v
          python -W error -m unittest discover -s tests -p "test_c15_spatial_official_eval.py" -v

