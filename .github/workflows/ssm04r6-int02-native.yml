name: Cognitum SSM R6-INT-02 native OS custody and supervised MEL research qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-ssm04r6-int02-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: SSM R6-INT-02 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin exact native mathematics and verification dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 protobuf==6.33.1
      - name: Original SSM and MEL plus native OS key, revision CAS and supervised worker acceptance
        run: python -m pytest -q research_tests/ssm04 research_tests/ssm04r1 research_tests/ssm04r2 research_tests/ssm04r3 research_tests/ssm04r4 research_tests/ssm04r5 research_tests/ssm04r6 research_tests/mel03b2/test_admission.py research_tests/mel_ssm_r6int01/test_journal.py research_tests/mel_ssm_r6int02/test_native_host.py --junitxml=ssm04r6-int02-native.xml
      - name: Probe genuine OS credential custody and local CAS, never synthetic fallback
        if: always()
        run: python -m research_tests.mel_ssm_r6int02.native_probe --output ssm04r6-int02-os-evidence.json
      - name: Preserve original accepted Git blob identities and exact source SHA
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > ssm04r6-int02-source-sha.txt
          git hash-object cognitum/research/ssm_stochastic.py cognitum/research/ssm_stochastic_extended.py cognitum/research/ssm_stochastic_continuous.py cognitum/research/ssm_stochastic_increments.py research_tests/ssm04r2/test_continuous.py research_tests/ssm04r3/test_increments.py cognitum/research/ssm_stochastic_smoothing.py research_tests/ssm04r4/test_correlated_smoothing.py cognitum/research/ssm_stochastic_streaming.py research_tests/ssm04r5/test_streaming.py cognitum/research/ssm_stochastic_checkpoints.py research_tests/ssm04r6/test_checkpoints.py cognitum/mel/admission.py cognitum/mel/ssm_recovery.py research_tests/mel_ssm_r6int01/test_journal.py cognitum/worker.py cognitum/runtime.py cognitum/mel/ssm_os_credentials.py cognitum/mel/ssm_revision_cas.py cognitum/mel/ssm_supervisor.py research_tests/mel_ssm_r6int02/test_native_host.py research_tests/mel_ssm_r6int02/native_probe.py > ssm04r6-int02-source-blobs.txt
          test "$(git hash-object cognitum/research/ssm_stochastic.py)" = "e6616d14f4b02bd447f872f2a67a444d83bc7df6"
          test "$(git hash-object cognitum/research/ssm_stochastic_extended.py)" = "19aefcc2c01ff629f6da5778b12fa0d495a3b610"
          test "$(git hash-object cognitum/research/ssm_stochastic_continuous.py)" = "026ee4e3b9e4e8be7d0158b9e8771bb691809293"
          test "$(git hash-object cognitum/research/ssm_stochastic_increments.py)" = "3eebcec1da8bae1cb3a65d33aab389c584cff89b"
          test "$(git hash-object research_tests/ssm04r2/test_continuous.py)" = "8b8b16a9f3a3355cadd8ac7b19bf05af097e737a"
          test "$(git hash-object research_tests/ssm04r3/test_increments.py)" = "ee311ead4b017e0e080f41cf412d22bfff0139b3"
          test "$(git hash-object cognitum/research/ssm_stochastic_smoothing.py)" = "bc657af3ba28474c72bbb34376739f6bdef82106"
          test "$(git hash-object research_tests/ssm04r4/test_correlated_smoothing.py)" = "f9cc09a3a54308135d6f25f63904d18d0d3ff6f8"
          test "$(git hash-object cognitum/research/ssm_stochastic_streaming.py)" = "731208b392d3a948ee7677c2e24f1117e2c8df79"
          test "$(git hash-object research_tests/ssm04r5/test_streaming.py)" = "826e1a7402cf89ae5c8855cbe52fd8280617c73a"
          test "$(git hash-object cognitum/research/ssm_stochastic_checkpoints.py)" = "30773bfaf4871bf686df0690419e3244c380be03"
          test "$(git hash-object research_tests/ssm04r6/test_checkpoints.py)" = "23ae54dc6a8c47e2230df98af58d4eba3808ba77"
          test "$(git hash-object cognitum/mel/admission.py)" = "405fa91935f62226ab0d1a2f0d8b7313e2327116"
          test "$(git hash-object cognitum/mel/ssm_recovery.py)" = "d9ca61ce225e90855b2bfba42f98abf78a7d3276"
          test "$(git hash-object research_tests/mel_ssm_r6int01/test_journal.py)" = "ba7cb4a29908e433d26840d7d5f8b51738d3bb1d"
          test "$(git hash-object cognitum/worker.py)" = "8246e955525655414c2da95d7153a794f011a0ef"
          test "$(git hash-object cognitum/runtime.py)" = "885c4bf56114c7cab98252539e5900113ae3418b"
          test "$(git hash-object cognitum/mel/ssm_os_credentials.py)" = "4492b855dd39dd972c13adde4434a13b3d9bb5a3"
          test "$(git hash-object cognitum/mel/ssm_revision_cas.py)" = "96c0bd869eaf732f750b44fc4f3fa612cb94f964"
          test "$(git hash-object cognitum/mel/ssm_supervisor.py)" = "7f5322f671ebccd3d142b1e3222185728d9627dd"
          test "$(git hash-object research_tests/mel_ssm_r6int02/test_native_host.py)" = "a5decb9fff612ce7aa2996a7404503bd15167cfb"
          test "$(git hash-object research_tests/mel_ssm_r6int02/native_probe.py)" = "8f5b17a924e38a91050851ca4dfbbf64dadcbdaa"
          test "$(git hash-object cognitum/research/ssm_stochastic.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_extended.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_extended.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_continuous.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_continuous.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_increments.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_increments.py")"
          test "$(git hash-object research_tests/ssm04r2/test_continuous.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r2/test_continuous.py")"
          test "$(git hash-object research_tests/ssm04r3/test_increments.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r3/test_increments.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_smoothing.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_smoothing.py")"
          test "$(git hash-object research_tests/ssm04r4/test_correlated_smoothing.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r4/test_correlated_smoothing.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_streaming.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_streaming.py")"
          test "$(git hash-object research_tests/ssm04r5/test_streaming.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r5/test_streaming.py")"
          test "$(git hash-object cognitum/research/ssm_stochastic_checkpoints.py)" = "$(git rev-parse "HEAD:cognitum/research/ssm_stochastic_checkpoints.py")"
          test "$(git hash-object research_tests/ssm04r6/test_checkpoints.py)" = "$(git rev-parse "HEAD:research_tests/ssm04r6/test_checkpoints.py")"
          test "$(git hash-object cognitum/mel/admission.py)" = "$(git rev-parse "HEAD:cognitum/mel/admission.py")"
          test "$(git hash-object cognitum/mel/ssm_recovery.py)" = "$(git rev-parse "HEAD:cognitum/mel/ssm_recovery.py")"
          test "$(git hash-object research_tests/mel_ssm_r6int01/test_journal.py)" = "$(git rev-parse "HEAD:research_tests/mel_ssm_r6int01/test_journal.py")"
          test "$(git hash-object cognitum/worker.py)" = "$(git rev-parse "HEAD:cognitum/worker.py")"
          test "$(git hash-object cognitum/runtime.py)" = "$(git rev-parse "HEAD:cognitum/runtime.py")"
          test "$(git hash-object cognitum/mel/ssm_os_credentials.py)" = "$(git rev-parse "HEAD:cognitum/mel/ssm_os_credentials.py")"
          test "$(git hash-object cognitum/mel/ssm_revision_cas.py)" = "$(git rev-parse "HEAD:cognitum/mel/ssm_revision_cas.py")"
          test "$(git hash-object cognitum/mel/ssm_supervisor.py)" = "$(git rev-parse "HEAD:cognitum/mel/ssm_supervisor.py")"
          test "$(git hash-object research_tests/mel_ssm_r6int02/test_native_host.py)" = "$(git rev-parse "HEAD:research_tests/mel_ssm_r6int02/test_native_host.py")"
          test "$(git hash-object research_tests/mel_ssm_r6int02/native_probe.py)" = "$(git rev-parse "HEAD:research_tests/mel_ssm_r6int02/native_probe.py")"
      - name: Preserve the actual native JUnit, Git identities and OS native custody evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitum-ssm04r6-int02-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ssm04r6-int02-native.xml
            ssm04r6-int02-source-sha.txt
            ssm04r6-int02-source-blobs.txt
            ssm04r6-int02-os-evidence.json
          if-no-files-found: warn

  independent:
    name: Independently verify exact 4 native source/JUnit/OS custody receipts
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cognitum-ssm04r6-int02-*
          path: original-native-evidence
          merge-multiple: false
      - name: Independently verify original JUnit case identities, Git pin hashes, OS security nonclaims
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('original-native-evidence')
          expected={f'cognitum-ssm04r6-int02-{osname}-py{ver}'
                    for osname in ('ubuntu-latest','windows-latest')
                    for ver in ('3.11','3.13')}
          assert {p.name for p in root.iterdir() if p.is_dir()}==expected
          blobs=["e6616d14f4b02bd447f872f2a67a444d83bc7df6","19aefcc2c01ff629f6da5778b12fa0d495a3b610","026ee4e3b9e4e8be7d0158b9e8771bb691809293","3eebcec1da8bae1cb3a65d33aab389c584cff89b","8b8b16a9f3a3355cadd8ac7b19bf05af097e737a","ee311ead4b017e0e080f41cf412d22bfff0139b3","bc657af3ba28474c72bbb34376739f6bdef82106","f9cc09a3a54308135d6f25f63904d18d0d3ff6f8","731208b392d3a948ee7677c2e24f1117e2c8df79","826e1a7402cf89ae5c8855cbe52fd8280617c73a","30773bfaf4871bf686df0690419e3244c380be03","23ae54dc6a8c47e2230df98af58d4eba3808ba77","405fa91935f62226ab0d1a2f0d8b7313e2327116","d9ca61ce225e90855b2bfba42f98abf78a7d3276","ba7cb4a29908e433d26840d7d5f8b51738d3bb1d","8246e955525655414c2da95d7153a794f011a0ef","885c4bf56114c7cab98252539e5900113ae3418b","4492b855dd39dd972c13adde4434a13b3d9bb5a3","96c0bd869eaf732f750b44fc4f3fa612cb94f964","7f5322f671ebccd3d142b1e3222185728d9627dd","a5decb9fff612ce7aa2996a7404503bd15167cfb","8f5b17a924e38a91050851ca4dfbbf64dadcbdaa"]
          ids=None
          counts={};probe={}
          for folder in sorted(root.iterdir()):
              assert folder.is_dir()
              assert (folder/'ssm04r6-int02-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
              assert (folder/'ssm04r6-int02-source-blobs.txt').read_text().splitlines()==blobs
              cases=list(ET.parse(folder/'ssm04r6-int02-native.xml').getroot().iter('testcase'))
              assert len(cases)==286,(folder,len(cases))
              assert not any(c.find(tag) is not None for c in cases
                             for tag in ('failure','error','skipped'))
              names=sorted((c.get('classname'),c.get('name')) for c in cases)
              assert len(set(names))==len(names)
              assert sum('mel_ssm_r6int02' in cls for cls,name in names)==12
              if ids is None:ids=names
              else:assert names==ids
              p=json.loads((folder/'ssm04r6-int02-os-evidence.json').read_text())
              assert p['schema']=='cognitum.ssm04r6int02.native_OS_custody.v1'
              assert p['hardware_monotonic_revision_qualified'] is False
              assert p['os_sandbox_worker_qualified'] is False
              assert p['installed_MEL_route_qualified'] is False
              if folder.name.startswith('cognitum-ssm04r6-int02-windows'):
                  assert p['os']=='win32' and p['os_native_credential_qualified'] is True
                  assert p['local_revision_CAS_qualified'] is True
              else:
                  assert p['os'].startswith('linux')
                  if not p['os_native_credential_qualified']:
                      assert p['native_credential_disposition']=='OS_KERNEL_KEYRING_UNAVAILABLE_FAIL_CLOSED'
                  else:
                      assert p['local_revision_CAS_qualified'] is True
              counts[folder.name]=len(cases)
              probe[folder.name]=p['native_credential_disposition']
          receipt=dict(schema='cognitum.ssm04r6int02.original_native_evidence.v1',
            status='PASS_SUPERVISED_SSM_AND_OS_NATIVE_CUSTODY_DISPOSITIONS',
            original_qualified_sha=os.environ['SOURCE_SHA'],
            tests_per_native=counts,os_native_custody_dispositions=probe,
            all_22_git_source_blobs_match=True,
            all_four_JUnit_test_identities_identical=True,
            installed_protected_sandbox_qualified=False,
            hardware_authoritative_monotonic_cas_qualified=False,
            installed_MEL_protobuf_route_authorized=False)
          Path('ssm04r6-int02-independent.json').write_text(json.dumps(
            receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve independent original source and native OS evidence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitum-ssm04r6-int02-independent
          path: ssm04r6-int02-independent.json
          if-no-files-found: warn
