name: Cognitum Lu IPC-01E-R2 native OS custody and signed receipt source gate

on:
  push:
    branches:
      - integration/cog-lu-ipc01e-r2-custody-20261121
    paths:
      - '.github/workflows/cog-lu-ipc01e-r2-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cog-lu-ipc01e-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Cognitum native custody / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned native protoc, Ed25519 and scientific requirements
        run: python -m pip install grpcio-tools==1.76.0 protobuf==6.33.1 numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 cryptography==46.0.3
      - name: Compile pinned original Lu workspace and Cognitum SSM Protobuf
        shell: bash
        run: |
          python -m research_tests.mel_lu_ipc01c.compile_pinned_lu_ssm \
            --root "$GITHUB_WORKSPACE/cognitum/mel/vendor" \
            --descriptor-out "$GITHUB_WORKSPACE/lu-cog-ssm-v1.desc" \
            --receipt "$GITHUB_WORKSPACE/lu-cog-ssm-v1-native.json"
      - name: Run accepted native IPC, actual OS custody and provisional issuer signature refusals
        run: python -m pytest -q research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py research_tests/mel_lu_ipc01b/test_native_carriers.py research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py research_tests/mel_lu_ipc01d/test_durable_lifecycle.py research_tests/mel_lu_ipc01e/test_outbox_reconcile.py research_tests/mel_ssm_r6int02/test_native_host.py research_tests/mel_lu_ipc01e_r2/test_native_custody_signed_receipt.py --junitxml=cog-lu-ipc01e-r2-native.xml
      - name: Retain original commit SHA and 27 exact code and source Git blobs
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > cog-lu-ipc01e-r2-source-sha.txt
          git hash-object cognitum/mel/vendor/lu/workspace/v0/workspace.proto cognitum/mel/vendor/cognitum/ssm/v1/ssm.proto cognitum/mel/lu_workspace_contract.py cognitum/mel/lu_adapter.py cognitum/mel/lu_ipc_readonly.py cognitum/mel/lu_ipc_native.py cognitum/mel/lu_ssm_contract.py cognitum/mel/lu_ipc_lifecycle.py cognitum/mel/lu_ipc_outbox.py cognitum/mel/lu_ipc_native_custody.py cognitum/mel/lu_ipc_receipt_attestation.py cognitum/mel/ssm_os_credentials.py cognitum/mel/ssm_revision_cas.py cognitum/mel/ssm_supervisor.py cognitum/mel/ssm_recovery.py cognitum/mel/admission.py research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py research_tests/mel_lu_ipc01b/test_native_carriers.py research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py research_tests/mel_lu_ipc01c/compile_pinned_lu_ssm.py research_tests/mel_lu_ipc01d/test_durable_lifecycle.py research_tests/mel_lu_ipc01e/test_outbox_reconcile.py research_tests/mel_lu_ipc01e_r2/test_native_custody_signed_receipt.py research_tests/mel_ssm_r6int02/test_native_host.py .gitattributes docs/integration/COG_LU_IPC_01E_R2_CUSTODY.md > cog-lu-ipc01e-r2-source-blobs.txt
          test "$(git hash-object cognitum/mel/vendor/lu/workspace/v0/workspace.proto)" = "4e01d921197fb1c58c99958479b1cede36e13c9a"
          test "$(git hash-object cognitum/mel/vendor/cognitum/ssm/v1/ssm.proto)" = "755562254afdbea686ee33b95567c505f2f85e49"
          test "$(git hash-object cognitum/mel/lu_workspace_contract.py)" = "ac57eb0afc4b2f0630531470e067461d8e2268ea"
          test "$(git hash-object cognitum/mel/lu_adapter.py)" = "300300b9f63f417afcc0ec650697e3012b7bdab0"
          test "$(git hash-object cognitum/mel/lu_ipc_readonly.py)" = "b21612457c3763dab8233d0eced5e5fffca968ad"
          test "$(git hash-object cognitum/mel/lu_ipc_native.py)" = "7c70333ddbe85fc187e6b1d5ba9956abca4c5a58"
          test "$(git hash-object cognitum/mel/lu_ssm_contract.py)" = "01ec228aa1ac1417c77d7a444f3c27a32b632e1c"
          test "$(git hash-object cognitum/mel/lu_ipc_lifecycle.py)" = "6c9faa951e37aa671fd61d49565a2f1a294ce400"
          test "$(git hash-object cognitum/mel/lu_ipc_outbox.py)" = "14fa22acd34f72e2df080d23b52e18a289a1cd1a"
          test "$(git hash-object cognitum/mel/lu_ipc_native_custody.py)" = "ccd183f01238ec72f6161a819b4005e7d1c49507"
          test "$(git hash-object cognitum/mel/lu_ipc_receipt_attestation.py)" = "e098cc14b719c02d1cd0b678a9ae8fee4d0b04b7"
          test "$(git hash-object cognitum/mel/ssm_os_credentials.py)" = "4492b855dd39dd972c13adde4434a13b3d9bb5a3"
          test "$(git hash-object cognitum/mel/ssm_revision_cas.py)" = "96c0bd869eaf732f750b44fc4f3fa612cb94f964"
          test "$(git hash-object cognitum/mel/ssm_supervisor.py)" = "7f5322f671ebccd3d142b1e3222185728d9627dd"
          test "$(git hash-object cognitum/mel/ssm_recovery.py)" = "d9ca61ce225e90855b2bfba42f98abf78a7d3276"
          test "$(git hash-object cognitum/mel/admission.py)" = "405fa91935f62226ab0d1a2f0d8b7313e2327116"
          test "$(git hash-object research_tests/mel_lu_ipc01a/test_workspace_contract.py)" = "05e40e09c7a3e9bfdf838d38f4e971682ec8cfd2"
          test "$(git hash-object research_tests/mel_lu_ipc01a/test_proto_client.py)" = "64ca56b974d8b0d0b5e3d566e8c0c5bab36ee474"
          test "$(git hash-object research_tests/mel_lu_ipc01b/test_native_carriers.py)" = "8d0e1774c3ba7d697b3fc6190295271f81b76e80"
          test "$(git hash-object research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py)" = "dc1af1130a6d5f37cf18c6a20b44ad09be251fc0"
          test "$(git hash-object research_tests/mel_lu_ipc01c/compile_pinned_lu_ssm.py)" = "c4a50016415af98509ac9fe7d0283b2c513ee29a"
          test "$(git hash-object research_tests/mel_lu_ipc01d/test_durable_lifecycle.py)" = "65b3470a4e7622b2e7c057a059009c66f730f181"
          test "$(git hash-object research_tests/mel_lu_ipc01e/test_outbox_reconcile.py)" = "139a2307ab96d47bba9a4d6b080b0aec2d0a9732"
          test "$(git hash-object research_tests/mel_lu_ipc01e_r2/test_native_custody_signed_receipt.py)" = "a5c42e3f6f66b4a5b896395461314ccc21de4ef2"
          test "$(git hash-object research_tests/mel_ssm_r6int02/test_native_host.py)" = "a5decb9fff612ce7aa2996a7404503bd15167cfb"
          test "$(git hash-object .gitattributes)" = "f475ae5dffefa219891604df8acae665de8c102a"
          test "$(git hash-object docs/integration/COG_LU_IPC_01E_R2_CUSTODY.md)" = "fd47062fd3744569b8051ff7d56cb903825a37a8"
      - name: Preserve original source, compiled descriptor and native OS test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog-lu-ipc01e-r2-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            cog-lu-ipc01e-r2-native.xml
            cog-lu-ipc01e-r2-source-sha.txt
            cog-lu-ipc01e-r2-source-blobs.txt
            lu-cog-ssm-v1.desc
            lu-cog-ssm-v1-native.json
            cognitum/mel/vendor/lu/workspace/v0/workspace_pb2.py
            cognitum/mel/vendor/cognitum/ssm/v1/ssm_pb2.py
          if-no-files-found: warn

  independent:
    name: Independent original exact-source and host nonauthority receipt
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cog-lu-ipc01e-r2-*
          path: original-native
          merge-multiple: false
      - name: Independently check original native source and no installed Core authority
        shell: bash
        env:
          EXACT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,xml.etree.ElementTree as ET
          root=Path("original-native")
          wanted={f"cog-lu-ipc01e-r2-{platform}-py{py}" for platform in
                  ("ubuntu-latest","windows-latest") for py in ("3.11","3.13")}
          assert {p.name for p in root.iterdir() if p.is_dir()}==wanted
          pinned=["4e01d921197fb1c58c99958479b1cede36e13c9a","755562254afdbea686ee33b95567c505f2f85e49","ac57eb0afc4b2f0630531470e067461d8e2268ea","300300b9f63f417afcc0ec650697e3012b7bdab0","b21612457c3763dab8233d0eced5e5fffca968ad","7c70333ddbe85fc187e6b1d5ba9956abca4c5a58","01ec228aa1ac1417c77d7a444f3c27a32b632e1c","6c9faa951e37aa671fd61d49565a2f1a294ce400","14fa22acd34f72e2df080d23b52e18a289a1cd1a","ccd183f01238ec72f6161a819b4005e7d1c49507","e098cc14b719c02d1cd0b678a9ae8fee4d0b04b7","4492b855dd39dd972c13adde4434a13b3d9bb5a3","96c0bd869eaf732f750b44fc4f3fa612cb94f964","7f5322f671ebccd3d142b1e3222185728d9627dd","d9ca61ce225e90855b2bfba42f98abf78a7d3276","405fa91935f62226ab0d1a2f0d8b7313e2327116","05e40e09c7a3e9bfdf838d38f4e971682ec8cfd2","64ca56b974d8b0d0b5e3d566e8c0c5bab36ee474","8d0e1774c3ba7d697b3fc6190295271f81b76e80","dc1af1130a6d5f37cf18c6a20b44ad09be251fc0","c4a50016415af98509ac9fe7d0283b2c513ee29a","65b3470a4e7622b2e7c057a059009c66f730f181","139a2307ab96d47bba9a4d6b080b0aec2d0a9732","a5c42e3f6f66b4a5b896395461314ccc21de4ef2","a5decb9fff612ce7aa2996a7404503bd15167cfb","f475ae5dffefa219891604df8acae665de8c102a","fd47062fd3744569b8051ff7d56cb903825a37a8"]
          reference=None
          receipts={}
          for folder in sorted(root.iterdir()):
              assert (folder/"cog-lu-ipc01e-r2-source-sha.txt").read_text().strip()==os.environ["EXACT_SHA"]
              assert (folder/"cog-lu-ipc01e-r2-source-blobs.txt").read_text().splitlines()==pinned
              meta=json.loads((folder/"lu-cog-ssm-v1-native.json").read_text())
              assert meta["exact_lu_workspace_proto_preserved"]
              assert meta["cognitum_domain_proto_compiled"]
              assert not meta["live_registration_authorized"]
              assert not meta["genuine_installed_lu_core_connected"]
              assert meta["exact_owner_sources"]["lu/workspace/v0/workspace.proto"]["git_blob_sha"]==pinned[0]
              assert meta["exact_owner_sources"]["cognitum/ssm/v1/ssm.proto"]["git_blob_sha"]==pinned[1]
              assert hashlib.sha256((folder/"lu-cog-ssm-v1.desc").read_bytes()).hexdigest()==meta["composite_descriptor_sha256"]
              for owner in ("lu/workspace/v0/workspace.proto","cognitum/ssm/v1/ssm.proto"):
                  module=folder/("cognitum/mel/vendor/"+owner.replace(".proto","_pb2.py"))
                  assert module.is_file()
                  assert hashlib.sha256(module.read_bytes()).hexdigest()==meta["generated_python_sha256"][owner]
              cases=list(ET.parse(folder/"cog-lu-ipc01e-r2-native.xml").getroot().iter("testcase"))
              assert len(cases)>=190,(folder.name,len(cases))
              assert not any(c.find(tag) is not None for c in cases for tag in ("failure","error","skipped"))
              identities=sorted((c.get("classname"),c.get("name")) for c in cases)
              assert len(set(identities))==len(identities)
              assert sum("mel_lu_ipc01e_r2" in (c.get("classname") or "") for c in cases)>=25
              assert sum("mel_ssm_r6int02" in (c.get("classname") or "") for c in cases)>=12
              shape=(identities,meta["composite_descriptor_sha256"],
                     tuple(sorted(meta["generated_python_sha256"].items())))
              if reference is None:reference=shape
              else:assert reference==shape
              receipts[folder.name]=len(cases)
          assert len(set(receipts.values()))==1
          result=dict(
              schema="cognitum.lu_ipc01e_r2.original_source_native_evidence.v1",
              status="PASS_NATIVE_OS_CUSTODY_ADAPTER_AND_PROPOSED_SIGNATURE_REFUSAL",
              original_qualified_SHA=os.environ["EXACT_SHA"],
              original_native_case_counts=receipts,
              exact_27_source_pins_and_protobufs_identical=True,
              original_four_JUnit_identities_identical=True,
              core_installed_production_signed_receipt_qualified=False,
              actual_lu_core_health_or_pure_authorization=False,
              installed_core_publisher_pin_enrolled=False,
              independent_hardware_remote_monotonic_antirollback=False,
              Linux_kernel_keyring_may_refuse_explicitly=True,
              actual_installed_supervised_worker_qualified=False,
              external_outbox_delivery_or_acknowledgment_authorized=False,
              model_tool_execution_authorized=False)
          Path("cog-lu-ipc01e-r2-independent.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Preserve original independent source/nonadmission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog-lu-ipc01e-r2-independent
          path: cog-lu-ipc01e-r2-independent.json
          if-no-files-found: warn
