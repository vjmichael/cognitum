name: Cognitum SSM-04-R3 genuine Ito increment and square-root native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-ssm04r3-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: SSM native stochastic increment and QR root / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin native scientific libraries
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 protobuf==6.33.1
      - name: Original SSM-04/R1/R2 and independent stochastic increment + QR R3 acceptance
        run: python -m pytest -q research_tests/ssm04 research_tests/ssm04r1 research_tests/ssm04r2 research_tests/ssm04r3 --junitxml=ssm04r3-native.xml
      - name: Record exact immutable SSM core/R2 and new R3 source
        shell: bash
        run: |
          git rev-parse HEAD > ssm04r3-source-sha.txt
          git hash-object cognitum/research/ssm_stochastic.py cognitum/research/ssm_stochastic_extended.py cognitum/research/ssm_stochastic_continuous.py cognitum/research/ssm_stochastic_increments.py research_tests/ssm04r2/test_continuous.py research_tests/ssm04r3/test_increments.py > ssm04r3-source-blobs.txt
          test "$(git hash-object cognitum/research/ssm_stochastic.py)" = "e6616d14f4b02bd447f872f2a67a444d83bc7df6"
          test "$(git hash-object cognitum/research/ssm_stochastic_extended.py)" = "19aefcc2c01ff629f6da5778b12fa0d495a3b610"
          test "$(git hash-object cognitum/research/ssm_stochastic_continuous.py)" = "026ee4e3b9e4e8be7d0158b9e8771bb691809293"
          test "$(git hash-object research_tests/ssm04r2/test_continuous.py)" = "8b8b16a9f3a3355cadd8ac7b19bf05af097e737a"
          test "$(git hash-object cognitum/research/ssm_stochastic_increments.py)" = "3eebcec1da8bae1cb3a65d33aab389c584cff89b"
          test "$(git hash-object research_tests/ssm04r3/test_increments.py)" = "ee311ead4b017e0e080f41cf412d22bfff0139b3"
          for f in cognitum/research/ssm_stochastic.py cognitum/research/ssm_stochastic_extended.py cognitum/research/ssm_stochastic_continuous.py cognitum/research/ssm_stochastic_increments.py research_tests/ssm04r2/test_continuous.py research_tests/ssm04r3/test_increments.py; do
            test "$(git hash-object "$f")" = "$(git rev-parse "HEAD:$f")" || { echo "Noncanonical file bytes: $f"; exit 1; }
          done
      - name: Archive native original exact-SHA JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog05-ssm04r3-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ssm04r3-native.xml
            ssm04r3-source-sha.txt
            ssm04r3-source-blobs.txt
          if-no-files-found: warn

  independent:
    name: Independent exact-source four-native stochastic mathematical receipts
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cog05-ssm04r3-*
          path: original-native-evidence
          merge-multiple: false
      - name: Independent original JUnit case matching and old/new Git source identity
        shell: bash
        env:
          LOCK_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,xml.etree.ElementTree as ET
          archive=Path('original-native-evidence')
          expected={f'cog05-ssm04r3-{os}-py{ver}'
                    for os in ('windows-latest','ubuntu-latest')
                    for ver in ('3.11','3.13')}
          names={x.name for x in archive.iterdir() if x.is_dir()}
          assert names==expected,(names,expected)
          results=[];source_blobs=[]
          known=['e6616d14f4b02bd447f872f2a67a444d83bc7df6',
                 '19aefcc2c01ff629f6da5778b12fa0d495a3b610',
                 '026ee4e3b9e4e8be7d0158b9e8771bb691809293',
                 '3eebcec1da8bae1cb3a65d33aab389c584cff89b',
                 '8b8b16a9f3a3355cadd8ac7b19bf05af097e737a',
                 'ee311ead4b017e0e080f41cf412d22bfff0139b3']
          for path in sorted(archive.iterdir()):
              assert (path/'ssm04r3-source-sha.txt').read_text().strip()==os.environ['LOCK_SHA']
              b=(path/'ssm04r3-source-blobs.txt').read_text().splitlines()
              assert b==known,(path,b)
              source_blobs.append(b)
              cases=list(ET.parse(path/'ssm04r3-native.xml').getroot().iter('testcase'))
              assert len(cases)>=125,(path,len(cases))
              assert not any(c.find(tag) is not None for c in cases
                             for tag in ('failure','error','skipped'))
              results.append((path.name,len(cases),sorted(
                  (case.get('classname'),case.get('name')) for case in cases)))
          assert len(results)==4
          assert all(x==source_blobs[0] for x in source_blobs)
          assert all(r[2]==results[0][2] for r in results)
          receipt={
            'schema':'cognitum.ssm04r3.independent.four_native_original_receipt.v1',
            'status':'PASS_EXACT_SOURCE_STOCHASTIC_INCREMENT_QR_AND_LEGACY_REGRESSION',
            'source_sha':os.environ['LOCK_SHA'],
            'original_native_platforms':4,
            'tests_per_platform':{k:n for k,n,_ in results},
            'all_original_git_source_blobs_identical':True,
            'all_original_JUnit_test_names_identical':True,
            'numerical_covariance_certified':False,
            'full_continuous_sensor_path_observed':False,
            'installed_MEL_actuation_authorized':False,
          }
          Path('ssm04r3-independent-native.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve source-bound independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog05-ssm04r3-independent-native
          path: ssm04r3-independent-native.json
          if-no-files-found: warn
