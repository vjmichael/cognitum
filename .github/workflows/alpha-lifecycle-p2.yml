name: Cognitum standalone alpha P2 revocation cancellation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only runtime requirements
        run: python -m pip install 'protobuf==6.33.6' 'pytest==9.0.2'
      - name: Real process and adversarial lifecycle tests
        run: python -m pytest -q tests/test_alpha_lifecycle.py tests/test_alpha_native.py tests/test_protobuf_codec.py
