name: Cognitum IPC-01E R5 suspended SSM and external stop-verifier qualification

on:
  push:
    branches:
      - integration/cog-lu-ipc01e-r2-custody-20261121
    paths:
      - cognitum/mel/ssm_r5_fixed_child.py
      - cognitum/mel/ssm_r5_windows_job.py
      - cognitum/mel/ssm_r5_stop_receipt.py
      - cognitum/mel/ssm_r5_linux_recovery.py
      - cognitum/mel/ssm_r4_protected.py
      - research_tests/mel_lu_ipc01e_r5/**
      - .github/workflows/cog-lu-ipc01e-r5-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cog-lu-ipc01e-r5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native R5 SSM proof / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned math Protobuf and test libraries
        run: python -m pip install grpcio-tools==1.76.0 protobuf==6.33.1 numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 cryptography==46.0.3
      - name: Compile original Lu workspace and Cognitum SSM Protobuf
        shell: bash
        run: |
          python -m research_tests.mel_lu_ipc01c.compile_pinned_lu_ssm \
            --root "$GITHUB_WORKSPACE/cognitum/mel/vendor" \
            --descriptor-out "$GITHUB_WORKSPACE/cog-lu-ipc01e-r5.desc" \
            --receipt "$GITHUB_WORKSPACE/cog-lu-ipc01e-r5-proto.json"
      - name: Compile R5 sources and execute fixed SSM protected native regressions
        run: |
          python -m compileall -q cognitum/mel/ssm_r5_fixed_child.py cognitum/mel/ssm_r5_windows_job.py cognitum/mel/ssm_r5_stop_receipt.py cognitum/mel/ssm_r5_linux_recovery.py cognitum/mel/ssm_r4_protected.py research_tests/mel_lu_ipc01e_r5
          python -m pytest -q research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py research_tests/mel_lu_ipc01b/test_native_carriers.py research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py research_tests/mel_lu_ipc01d/test_durable_lifecycle.py research_tests/mel_lu_ipc01e/test_outbox_reconcile.py research_tests/mel_ssm_r6int02/test_native_host.py research_tests/mel_lu_ipc01e_r2/test_native_custody_signed_receipt.py research_tests/mel_lu_ipc01e_r3/test_installed_host_prerequisites.py research_tests/mel_lu_ipc01e_r4/test_bound_protected_ssm.py research_tests/mel_lu_ipc01e_r5/test_windows_scm_and_external_stop.py research_tests/mel_lu_ipc01e_r5/test_linux_original_recovery.py --junitxml=cog-lu-ipc01e-r5-native.xml
      - name: Persist exact source SHA and 9 exact Git blob pins
        shell: bash
        if: always()
        run: |
          git rev-parse HEAD > cog-lu-ipc01e-r5-source-sha.txt
          git hash-object cognitum/mel/ssm_r4_protected.py cognitum/mel/ssm_supervisor.py cognitum/mel/ssm_recovery.py cognitum/mel/ssm_r5_fixed_child.py cognitum/mel/ssm_r5_windows_job.py cognitum/mel/ssm_r5_stop_receipt.py cognitum/mel/ssm_r5_linux_recovery.py research_tests/mel_lu_ipc01e_r5/test_windows_scm_and_external_stop.py research_tests/mel_lu_ipc01e_r5/test_linux_original_recovery.py > cog-lu-ipc01e-r5-source-blobs.txt
      - name: Preserve original OS custody source tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog-lu-ipc01e-r5-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            cog-lu-ipc01e-r5-native.xml
            cog-lu-ipc01e-r5-source-sha.txt
            cog-lu-ipc01e-r5-source-blobs.txt
            cog-lu-ipc01e-r5.desc
            cog-lu-ipc01e-r5-proto.json
          if-no-files-found: warn

  independent:
    name: R5 exact original source and no installed Core authority
    runs-on: ubuntu-latest
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cog-lu-ipc01e-r5-*
          path: original-native
          merge-multiple: false
      - name: Independently verify original JUnit identities, pinned source, refusals
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('original-native')
          expected={f"cog-lu-ipc01e-r5-{target}-py{py}" for target in
                    ('ubuntu-latest','windows-latest') for py in ('3.11','3.13')}
          assert {p.name for p in root.iterdir()}==expected
          source_paths=(
              'cognitum/mel/ssm_r4_protected.py',
              'cognitum/mel/ssm_supervisor.py',
              'cognitum/mel/ssm_recovery.py',
              'cognitum/mel/ssm_r5_fixed_child.py',
              'cognitum/mel/ssm_r5_windows_job.py',
              'cognitum/mel/ssm_r5_stop_receipt.py',
              'cognitum/mel/ssm_r5_linux_recovery.py',
              'research_tests/mel_lu_ipc01e_r5/test_windows_scm_and_external_stop.py',
              'research_tests/mel_lu_ipc01e_r5/test_linux_original_recovery.py',
          )
          pins=[]
          for path in source_paths:
              raw=Path(path).read_bytes()
              pins.append(hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest())
          baseline=None;counts={}
          for folder in sorted(root.iterdir()):
              assert (folder/'cog-lu-ipc01e-r5-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
              assert (folder/'cog-lu-ipc01e-r5-source-blobs.txt').read_text().splitlines()==pins
              proto=json.loads((folder/'cog-lu-ipc01e-r5-proto.json').read_text())
              assert proto['exact_lu_workspace_proto_preserved']
              assert proto['cognitum_domain_proto_compiled']
              assert not proto['genuine_installed_lu_core_connected']
              testcases=list(ET.parse(folder/'cog-lu-ipc01e-r5-native.xml').getroot().iter('testcase'))
              assert len(testcases)>=230
              assert not any(t.find(s) is not None for t in testcases for s in ('failure','error','skipped'))
              identities=sorted((t.get('classname'),t.get('name')) for t in testcases)
              assert len(set(identities))==len(identities)
              if baseline is None: baseline=identities
              else: assert identities==baseline
              counts[folder.name]=len(identities)
          report={
              'schema':'cognitum.lu_ipc01e_r5.original_source_receipt.v1',
              'status':'PASS_NATIVE_OS_FIXED_SSM_AND_EXTERNAL_SIGNATURE_SOURCE_ONLY',
              'exact_source_sha':os.environ['SOURCE_SHA'],
              'git_source_blob_count':len(pins),
              'source_blobs_match':True,
              'native_junit_identities_match':True,
              'platform_counts':counts,
              'windows_suspended_SSM_source_path':True,
              'linux_cgroup_positive_delegated_qualified':False,
              'windows_installed_SCM_service_verified':False,
              'installed_signer_key_custody_verified':False,
              'independent_kernel_stop_claim_accepted_as_production':False,
              'real_Lu_Core_Health_exchange':False,
              'real_Lu_Core_PURE_COMPUTE_grant':False,
              'external_output_release_or_ack':False,
          }
          Path('cog-lu-ipc01e-r5-independent.json').write_text(
              json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Preserve independent no-authority receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog-lu-ipc01e-r5-independent
          path: cog-lu-ipc01e-r5-independent.json
          if-no-files-found: warn
