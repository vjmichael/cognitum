name: Cognitum BENCH-02 R3-R1 pin exact accepted NOAA originals

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cognitum-bench02-r3-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pin-originals:
    name: Preserve exact source-locked independently verified R3 original bytes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout only existing reviewed R3 source
        uses: actions/checkout@v4
      - name: Download accepted run's immutable archived evidence once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/vjmichael/cognitum/actions/artifacts/14694461680/zip' \
            --output accepted-r3-originals.zip
      - name: Verify original artifact and archive only byte-identical fixed sites
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from datetime import datetime
          from pathlib import Path
          from collections import defaultdict,Counter
          zip_path=Path('accepted-r3-originals.zip')
          assert hashlib.sha256(zip_path.read_bytes()).hexdigest() == '2d15ac47bda440eaaf7351a558d18e695814f4728ec28ff5e82852510ff70e3b'
          expected={
            'KSEA':('2b2772ea7ad91d76f22e1be82269c0b41e86294392241a42bae9d81f061a6205',261,138884,'61e73936c5a79139d59de847fc542fa20399fb6d9817f181d3ffdd3bc741cf7a'),
            'KDEN':('dd72f4e2b9dde753c2a9c0f964ca86eb2b8091eeaf9b7b807c3b8d7a98618645',259,127608,'4057e4f76528d0e58696684e9acfb8d678b41151ad3b049bee16014cff841384'),
            'KATL':('ac0b69ce3b4755e56e9273310af94be638dd240d9857a98a719812f1dd441622',242,127196,'4db676db1494ae0d98425f4aede5962da24429d2c5405da6c97e592eab15ce92'),
          }
          pin='fd0b6a372ee5cd9ee8870ad20c475261460a069daf4fd52f56e8dcc2961a5104'
          original_protocol=Path('docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json').read_bytes()
          assert hashlib.sha256(original_protocol).hexdigest()==pin
          root=Path('research_tests/orcbench02/r3_20261121')
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
            assert z.testzip() is None
            assert z.read('source-sha.txt').decode().strip() == 'd6ec165ee7dfbe6af08bb2f428c328869fefa3b0'
            assert z.read('source-blobs.txt').decode().strip().splitlines()==[
              '512b25936105bb89bdf4957d1c0da14195e784fc',
              'dcb40c878969f37d6839f2ff74285de4657c385c',
              '32cf87c327dc065d9ee4b0641c6ccb7e89666adf',
            ]
            summary=json.loads(z.read('source-summary.json'))
            assert summary['run_context']=='github-run:44872224722:attempt:1'
            assert [x['site'] for x in summary['stations']]==['KSEA','KDEN','KATL']
            assert not summary['model_fitting_performed']
            for site,(expected_sha,count,byte_count,cohort_sha) in expected.items():
              for kind in ('original','receipt','cohort'):
                name=f'capture-r3/{site}-{kind}.json'
                payload=z.read(name)
                assert len(payload)<2_000_001
                (root/f'{site}-{kind}.json').write_bytes(payload)
              raw=(root/f'{site}-original.json').read_bytes()
              receipt=json.loads((root/f'{site}-receipt.json').read_bytes())
              cohort=json.loads((root/f'{site}-cohort.json').read_bytes())
              assert hashlib.sha256(raw).hexdigest()==expected_sha
              assert len(raw)==byte_count and len(json.loads(raw))==count
              assert receipt['source_sha256']==expected_sha
              assert receipt['source_bytes']==byte_count
              assert receipt['cohort_sha256']==cohort_sha
              assert receipt['source_url']==f'https://aviationweather.gov/api/data/metar?ids={site}&format=json&hours=240'
              assert receipt['preregistration_sha256']==pin
              assert not receipt['first_capture_clock_independently_signed']
              assert not receipt['historical_public_availability_verified']
              assert not receipt['production_admission']
              assert cohort['no_fitting_or_scoring_performed']
              assert cohort['original_source_rows']==count
              assert [h['forecast_horizon_hours'] for h in cohort['horizons']]==[1,3,6]
              assert hashlib.sha256(json.dumps(cohort,sort_keys=True,separators=(',',':')).encode()).hexdigest()==cohort_sha
              assert all(h['folds']['test']['reason_counts']['first_capture_bounded_eligible']==0 for h in cohort['horizons'])
              assert all(row['icaoId']==site for row in json.loads(raw))
            (root/'source-summary.json').write_bytes(z.read('source-summary.json'))
            (root/'source-sha.txt').write_bytes(z.read('source-sha.txt'))
            (root/'source-blobs.txt').write_bytes(z.read('source-blobs.txt'))
          manifest={
            'scope':'BENCH02_R3_SOURCE_ONLY_ORIGINAL_BYTE_ARCHIVAL',
            'native_run':44872224722,
            'native_sha':'d6ec165ee7dfbe6af08bb2f428c328869fefa3b0',
            'source_artifact_id':14694461680,
            'source_artifact_zip_sha256':'2d15ac47bda440eaaf7351a558d18e695814f4728ec28ff5e82852510ff70e3b',
            'frozen_preregistration_sha256':pin,
            'sites':{s:{'sha256':v[0],'rows':v[1],'bytes':v[2],'cohort_sha256':v[3]} for s,v in expected.items()},
            'strict_first_capture_bounded_test_eligible_origins':0,
            'historical_public_availability_attested':False,
            'production_admission':False,
            'forecast_fitting_or_scoring':False,
          }
          (root/'archive-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish only pinned original evidence non-forced without new CI
        shell: bash
        run: |
          git config user.name 'cognitum-evidence-bot'
          git config user.email 'cognitum-evidence-bot@users.noreply.github.com'
          git add research_tests/orcbench02/r3_20261121/
          git diff --cached --exit-code --quiet && { echo 'No new sources'; exit 0; }
          git commit -m 'docs: preserve accepted R3 original NOAA sources and cohort receipts [skip ci]'
          git push origin HEAD:research/orc-bench02-r3-preregister-20261120
