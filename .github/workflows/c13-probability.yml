name: C13 real SciPy Bayesian inference and calibration acceptance
on:
  push:
    paths:
      - 'cognitum/probability_*.py'
      - 'cognitum/proto/probability_pb2.py'
      - 'proto/cognitum/probability/v1/**'
      - 'tests/test_c13_*.py'
      - 'tools/c13_component_benchmark.py'
      - 'tools/check_proto_descriptors.py'
      - 'pyproject.toml'
      - '.github/workflows/c13-probability.yml'
  pull_request:
    paths:
      - 'cognitum/probability_*.py'
      - 'cognitum/proto/probability_pb2.py'
      - 'proto/cognitum/probability/v1/**'
      - 'tests/test_c13_*.py'
      - 'tools/check_proto_descriptors.py'
      - 'pyproject.toml'
      - '.github/workflows/c13-probability.yml'
  workflow_dispatch:

jobs:
  c13-real-stats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maintained SciPy and Protobuf compiler
        run: python -m pip install -e ".[probability-stats]" grpcio-tools
      - name: Require actual numerical backend and consistent dependency graph
        run: |
          python -m pip check
          python -c "import scipy; from scipy.stats import beta; from scipy.special import logsumexp; print('SciPy',scipy.__version__)"
      - name: Compare generated Protobuf schema against compiler
        run: |
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled-c13.pb proto/cognitum/probability/v1/probability.proto
          python tools/check_proto_descriptors.py compiled-c13.pb
      - name: Genuine Bayesian, calibration and negative-path tests
        run: python -W error -m unittest discover -s tests -p "test_c13_*.py" -v
      - name: Measured real-library reference benchmark
        run: python tools/c13_component_benchmark.py
