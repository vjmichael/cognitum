name: Cognitum POST-NATIVE-05-R4 real-time native HDC-KAN-SSM physical science
on:
  push:
    branches:
      - 'research/ssm-postnative05-r4-native-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical:
    name: "Elapsed-time science / ${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact scientific research dependencies
        run: python -m pip install -e ".[scientific]" "numpy==2.3.5" "scipy==1.17.0" "pytest==9.0.2"
      - name: Run exact source-pinned temporal science and native KAN/HDC abstention
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: python -m tools.ssm_postnative05r4.acceptance postnative05-r4-evidence
      - name: Preserve native source, JUnit, measured-data science and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postnative05-r4-${{ matrix.os }}-py${{ matrix.python-version }}
          path: postnative05-r4-evidence/
          if-no-files-found: warn
