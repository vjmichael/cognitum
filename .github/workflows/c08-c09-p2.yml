name: Cognitum C08 C09 P2 version and signed metadata checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-p2:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional NumPy cryptography and Protobuf
        run: python -m pip install 'protobuf==6.33.6' 'numpy==2.2.6' 'cryptography==46.0.4' 'pytest==9.0.2' 'grpcio-tools==1.76.0'
      - name: C08 stale-index and C09 approval adversarial gates
        run: python -m pytest -q tests/test_research_optional.py tests/test_c08_index_lifecycle.py tests/test_c09_signed_approval.py
      - name: Verify both Protobuf contracts against independent compiler output
        run: |
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=optional.pb proto/cognitum/research/v1/optional.proto
          python -m tools.check_proto_descriptors optional.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=approval.pb proto/cognitum/research/v1/kan_approval.proto
          python -m tools.check_proto_descriptors approval.pb
