name: COG-07 practical CPU causal libraries and preserved cooperative acceptance
on:
  push:
    branches: [development/cog-06-cooperative-reasoning-20261116]
    paths:
      - cognitum/**
      - research_tests/hdc/**
      - tools/cog03bc_research_acceptance.py
      - tools/cog03c2_acceptance.py
      - tools/cog03c2c_acceptance.py
      - tools/cog03c2c_pilot.py
      - docs/research/COG03C2C_SOURCE_MANIFEST.json
      - tools/cog03c2b_pilot.py
      - tools/cog03c2_frontier_pilot.py
      - tools/cog03c2_geometry_pilot.py
      - docs/research/COG03C2_SOURCE_MANIFEST.json
      - tools/cog03c_capacity_pilot.py
      - tools/cog03b2_ordered_retrieval.py
      - docs/research/COG03BC_SOURCE_MANIFEST.json
      - proto/**
      - tests/**
      - tools/cog06b_cpu_acceptance.py
      - tools/cog06d_composition_evidence.py
      - tools/c10_real_proof_smoke.py
      - tools/c15_trackeval*.py
      - tools/c15_compare_official_trackeval.py
      - tools/c15_real_mot_acceptance.py
      - tools/c15_stage_trackeval.py
      - .github/workflows/c10-alethe-proof.yml
      - .github/workflows/c15-real-mot17.yml
      - tools/c15_bytetrack_benchmark.py
      - tools/c15_install_bytetrack.py
      - .github/workflows/cog06g-bytetrack.yml
      - tools/cog07_causal_evidence.py
      - .github/workflows/c14-standard-libraries.yml
      - .github/workflows/cog07-causal.yml
      - .github/workflows/cog06b-cpu-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-components:
    name: COG-07 / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      PYTHONUTF8: '1'
      COG06B_EXPECTED_SHA: ${{ github.sha }}
      COG06B_REQUIRE_NATIVE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute independent cooperative reasoning and preserved CPU component acceptance
        run: python -m tools.cog06b_cpu_acceptance
      - name: Preserve exact source-bound result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog07-${{ matrix.os }}-py${{ matrix.python-version }}
          path: cog06b-artifacts/
          if-no-files-found: error
          retention-days: 30
  native-proof:
    name: COG-06E strict native Alethe certificate gate
    uses: ./.github/workflows/c10-alethe-proof.yml
  native-trackeval:
    name: COG-06E official matched TrackEval gate
    uses: ./.github/workflows/c15-real-mot17.yml

  reviewed-bytetrack:
    name: COG-06G reviewed actual library and matched comparison
    uses: ./.github/workflows/cog06g-bytetrack.yml

  practical-causal:
    name: COG-07 actual maintained causal library acceptance
    uses: ./.github/workflows/cog07-causal.yml

  hdc-research:
    name: COG-03BC / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      COG03BC_EXPECTED_SHA: ${{ github.sha }}
      COG03C2C_DATASETS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && '1' || '0' }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dedicated no-skip native HDC algebra and encoder research acceptance
        run: python -m tools.cog03c2c_acceptance
      - name: Archive exact-source HDC evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog03bc-${{ matrix.os }}-py${{ matrix.python-version }}
          path: cog03bc-artifacts/
          if-no-files-found: error
          retention-days: 30
