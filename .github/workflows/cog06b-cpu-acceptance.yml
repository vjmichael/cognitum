name: COG-06D independent cooperative reasoning and CPU regression
on:
  push:
    branches: [development/cog-06-cooperative-reasoning-20261116]
    paths:
      - cognitum/**
      - proto/**
      - tests/**
      - tools/cog06b_cpu_acceptance.py
      - tools/cog06d_composition_evidence.py
      - .github/workflows/cog06b-cpu-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-components:
    name: COG-06D / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      PYTHONUTF8: '1'
      COG06B_EXPECTED_SHA: ${{ github.sha }}
      COG06B_REQUIRE_NATIVE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute independent cooperative reasoning and preserved CPU component acceptance
        run: python -m tools.cog06b_cpu_acceptance
      - name: Preserve exact source-bound result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog06d-${{ matrix.os }}-py${{ matrix.python-version }}
          path: cog06b-artifacts/
          if-no-files-found: error
          retention-days: 30
