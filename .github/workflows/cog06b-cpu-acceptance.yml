  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-components:
    name: COG-07 / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      PYTHONUTF8: '1'
      COG06B_EXPECTED_SHA: ${{ github.sha }}
      COG06B_REQUIRE_NATIVE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute independent cooperative reasoning and preserved CPU component acceptance
        run: python -m tools.cog06b_cpu_acceptance
      - name: Preserve exact source-bound result and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog07-${{ matrix.os }}-py${{ matrix.python-version }}
          path: cog06b-artifacts/
          if-no-files-found: error
          retention-days: 30
  native-proof:
    name: COG-06E strict native Alethe certificate gate
    uses: ./.github/workflows/c10-alethe-proof.yml
  native-trackeval:
    name: COG-06E official matched TrackEval gate
    uses: ./.github/workflows/c15-real-mot17.yml

  reviewed-bytetrack:
    name: COG-06G reviewed actual library and matched comparison
    uses: ./.github/workflows/cog06g-bytetrack.yml

  practical-causal:
    name: COG-07 actual maintained causal library acceptance
    uses: ./.github/workflows/cog07-causal.yml

  hdc-research:
    name: COG-03BC / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      PYTHONUTF8: '1'
      COG03BC_EXPECTED_SHA: ${{ github.sha }}
      COG03C2C_DATASETS: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && '1' || '0' }}
      COG03F2_SYNTH_REQUIRED: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && '1' || '0' }}
      COG03F_RTL_REQUIRED: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && '1' || '0' }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install required CORe50 image test dependency
        run: |
          python -m pip install --only-binary=:all: Pillow==12.3.0
          python -c "import PIL; assert PIL.__version__ == '12.3.0'; print(PIL.__version__)"
      - name: Locate native compiler on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            foreach ($dir in @('C:\msys64\mingw64\bin', 'C:\msys64\ucrt64\bin')) {
              if (Test-Path (Join-Path $dir 'gcc.exe')) {
                Add-Content -Path $env:GITHUB_PATH -Value $dir
                break
              }
            }
          }
      - name: Install mandatory native RTL simulator and XC7 synthesizer
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys
          iverilog -V
          yosys -V
      - name: Dedicated no-skip native HDC algebra, RGB and hardware research acceptance
        run: python -m tools.cog03f2_acceptance
      - name: Dedicated H12 matched CPU pipeline contracts and quick profile
        run: python -m tools.h12.acceptance
      - name: Dedicated source-bound HDC projection and symbolic capacity pilot
        run: python -m tools.h12_projection.acceptance
      - name: Dedicated source-bound VFA function algebra and independent numerical oracles
        run: python -m tools.vfa.acceptance
      - name: Dedicated VFA-02 RKHS algebra and approximation limits
        run: python -m tools.vfa2.acceptance
      - name: Dedicated VFA-03 multivariate tensor kernels, compositions and calculus
        run: python -m tools.vfa3.acceptance
      - name: MEL-01 inventory and negative controls (no admission)
        run: python -m unittest discover -s research_tests/mel -v
      - name: MEL-01 exact-checkout mathematical capability reconciliation
        run: python -m tools.mel.audit
      - name: MEL-02 typed immutable VFA runtime and independent numeric oracles
        run: python -m tools.mel02.acceptance
      - name: MEL-03A reviewed model JSON schemas and typed reference worker round trips
        run: python -m tools.mel03a.acceptance
      - name: Install existing Protobuf runtime and independent compiler for MEL-03B1
        run: |
          python -m pip install --only-binary=:all: "protobuf>=6.31,<8" "grpcio-tools>=1.70,<2"
      - name: MEL-03B1 native mathematical Protobuf contracts and worker round trips
        run: python -m tools.mel03b1.acceptance
      - name: MEL-03B2 scoped compute-only host admission and adversarial acceptance
        run: python -m tools.mel03b2.acceptance
      - name: MEL-03C initial native HDC and KAN reference contracts
        run: python -m tools.mel03c.acceptance
      - name: MEL-03C2 shared scoped HDC and KAN admission and resource accounting
        run: python -m tools.mel03c2.acceptance
      - name: MEL-03C3 model codecs and scoped approved checkpoint custody
        run: python -m tools.mel03c3.acceptance
      - name: MEL-04A typed mathematical sample and bit exchange
        run: python -m tools.mel04a.acceptance
      - name: MEL-04B bounded cooperative mathematical graph execution
        run: python -m tools.mel04b.acceptance
      - name: MEL-05A independent represented-input numerical and exact HDC witnesses
        run: python -m tools.mel05a.acceptance
      - name: MEL-05B-R1 inline numerical verification and guarded threshold dispatch
        run: python -m tools.mel05b.acceptance
      - name: MEL-05C VFA-04 continuous function enclosures and verified transformations
        run: python -m tools.mel05c.acceptance
      - name: MEL-06A-R1 native scoped intent and recorded GGUF replay acceptance
        run: python -m tools.mel06a.acceptance
      - name: COG-04A trainable KAN and verified cooperative execution
        run: python -m tools.cog04a.acceptance --out cog03bc-artifacts/cog04a
      - name: COG-04B typed certified polynomial KAN and three-engine exchange
        run: python -m tools.cog04b.acceptance --out cog03bc-artifacts/cog04b
      - name: COG-04C certified polynomial KAN cooperative graph and model grounding
        run: python -m tools.cog04c.acceptance --out cog03bc-artifacts/cog04c
      - name: COG-04D adaptive KAN refinement and compositional learning
        run: python -m tools.cog04d.acceptance --out cog03bc-artifacts/cog04d
      - name: COG-04E exact scalar symbolic extraction and verified operators
        run: python -m tools.cog04e.acceptance --out cog03bc-artifacts/cog04e
      - name: COG-04F exact multivariate symbolic extraction and verified operators
        run: python -m tools.cog04f.acceptance --out cog03bc-artifacts/cog04f
      - name: COG-04G exact Cartesian scientific operators
        run: python -m tools.cog04g.acceptance --out cog03bc-artifacts/cog04g
      - name: COG-04H exact differential equations and residual certificates
        run: python -m tools.cog04h.acceptance --out cog03bc-artifacts/cog04h
      - name: Preserve verified public MobileNetV2 checkpoint for offline CORe50
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path
          expected = "7ebf99e03e254b273379b23edca7ec0da9f48273b23a332b93c1c99d49e86e8f"
          dest = Path("cog03bc-artifacts/mobilenet_v2-7ebf99e0.pth")
          dest.parent.mkdir(parents=True, exist_ok=True)
          tmp = dest.with_suffix(".partial")
          try:
              with urllib.request.urlopen("https://download.pytorch.org/models/mobilenet_v2-7ebf99e0.pth", timeout=45) as response, tmp.open("wb") as output:
                  payload = response.read((30 << 20) + 1)
                  if not payload or len(payload) > (30 << 20) or hashlib.sha256(payload).hexdigest() != expected:
                      raise ValueError("checkpoint size or SHA256 mismatch")
                  output.write(payload)
              tmp.replace(dest)
              print("Verified checkpoint:", expected, dest.stat().st_size)
          finally:
              tmp.unlink(missing_ok=True)
          PY
      - name: Archive exact-source HDC evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog03bc-${{ matrix.os }}-py${{ matrix.python-version }}
          path: cog03bc-artifacts/
          if-no-files-found: error
          retention-days: 30
