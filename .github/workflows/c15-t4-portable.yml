name: Cognitum C15 portable tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test dependencies
        run: python -m pip install pytest==9.0.2 protobuf==6.33.6 cryptography==46.0.4 asn1crypto==1.5.1
      - name: Focused C15 source and T4 tests
        run: python -m pytest -q tests/test_c15_t4_functional_material.py tests/test_c15_t4_p2_intervals_solver_loads.py tests/test_c15_t4_p3_evaluation.py tests/test_c15_t4_p3_holdout_audit.py tests/test_c15_t4_p4_evidence_gate.py tests/test_c15_t4_p5_p7_assurance.py tests/test_c15_t4_p8_p10_external_readiness.py tests/test_c15_t4_p11_p12_boundary.py tests/test_c15_t4_p13_windows_runner_contract.py tests/test_c15_t4_p13_evidence_verifier.py tests/test_c15_checkpoint_diff.py
