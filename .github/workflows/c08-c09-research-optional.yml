name: Cognitum C08 C09 opt-in P1
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install opt-in research dependencies
        run: python -m pip install 'protobuf==6.33.6' 'numpy==2.2.6' 'pytest==9.0.2'
      - name: First-party typed C08 C09 optional probes
        run: python -m pytest -q tests/test_research_optional.py
