name: Cognitum BENCH-02 R2 native and one real METAR acquisition

on:
  push:
    branches:
      - research/orc-bench02-r2-acquisition-20261120
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-bench02-r2-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-source:
    name: Source and refusal / \${{ matrix.os }} / Python \${{ matrix.python }}
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout same source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python }}
      - name: Install exact pytest dependency
        run: python -m pip install pytest==9.0.2
      - name: Run inherited R1 and new R2 negative source tests
        run: python -m pytest -q tests/test_orc_bench02_availability.py tests/test_orc_bench02_acquisition.py --junitxml=bench02-r2.xml
      - name: Pin original reviewed source SHA and canonical Git blobs
        shell: bash
        run: |
          git rev-parse HEAD > source-sha.txt
          git hash-object tools/orcbench02/acquisition.py tests/test_orc_bench02_acquisition.py tools/orcbench02/availability_gate.py tests/test_orc_bench02_availability.py docs/research/orcgraph/ORCH01E_BENCH02_R2.md > source-blobs.txt
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench02-r2-\${{ matrix.os }}-py\${{ matrix.python }}
          path: |
            bench02-r2.xml
            source-sha.txt
            source-blobs.txt
          if-no-files-found: warn

  source-acquisition:
    name: Original AWC source capture (one request)
    needs: native-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unchanged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original NOAA AWC HTTPS capture
        shell: bash
        run: |
          python -m tools.orcbench02.acquisition --station KMCI --output capture-r2 --context "github-run:\${{ github.run_id }}:attempt:\${{ github.run_attempt }}" > capture-summary.json
          git rev-parse HEAD > source-sha.txt
          git hash-object tools/orcbench02/acquisition.py tools/orcbench02/availability_gate.py > source-blobs.txt
          python - <<'PY'
          from tools.orcbench02.acquisition import verify_journal
          a=verify_journal("capture-r2")
          assert len(a)==1 and len(a[0]["versions"])>0
          assert not a[0]["production_authorized"]
          PY
      - name: Preserve exact original upstream bytes and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench02-r2-real-KMCI
          path: |
            capture-r2/
            capture-summary.json
            source-sha.txt
            source-blobs.txt
          if-no-files-found: warn
