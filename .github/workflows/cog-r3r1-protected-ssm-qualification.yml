name: Cognitum protected SCM AppContainer SSM numerical qualification
on:
  push:
    branches: [integration/cog-lu-ipc01e-r2-custody-20261121]
    paths:
      - .github/workflows/cog-r3r1-protected-ssm-qualification.yml
      - native/windows_scm_production/src/qual_appcontainer.rs
      - native/windows_scm_production/src/qual_ssm.rs
      - native/windows_scm_production/src/qual_cng_terminal.rs
      - native/windows_scm_production/src/qual_recovery.rs
      - native/windows_scm_production/src/main.rs
      - native/windows_scm_production/Cargo.toml
      - cognitum/mel/ssm_r5_production_child.py
      - scripts/cog-r3r1-qualify-protected-ssm.ps1
      - scripts/cog_r3r1_qualifier_pins.py
      - scripts/cog_r3r1_qualifier_cng_verify.py
      - scripts/cog_r3r1_qualifier_recovery_verify.py
      - scripts/cog-r5-physical02-r3-r1-nonadmin.ps1
      - scripts/cog-r5-physical02-r3-r1-user-profile.ps1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cog-r3r1-ssm-lineage
  cancel-in-progress: false
jobs:
  windows:
    name: Real SCM nonadmin AppContainer Job and independent SSM numerical proof
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned NumPy SciPy and protocol libraries
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 protobuf==6.33.1 grpcio-tools==1.76.0 cryptography==46.0.3 pytest==9.0.2
      - name: Uncontained process must refuse original request before parsing
        shell: pwsh
        run: |
          python -m unittest -q research_tests.mel_lu_ipc01e_r5.test_production_ssm_child_gate
          if($LASTEXITCODE -ne 0){throw 'Uncontained worker refusal failed'}
      - name: Separate disposable host, peer, I/O and runtime
        shell: pwsh
        run: |
          $p=Join-Path $PWD 'native/windows_scm_production/target'
          foreach($x in @('q-host','q-profile','q-io','q-runtime-parent')){
            New-Item -ItemType Directory -Path (Join-Path $p $x) -Force | Out-Null
          }
      - name: Independent standard-user no-capability AppContainer profile
        id: user
        shell: pwsh
        run: |
          $p=Join-Path $PWD 'native/windows_scm_production/target'
          $python=(& python -c 'import sys;print(sys.executable)').Trim()
          & ./scripts/cog-r5-physical02-r3-r1-nonadmin.ps1 -Mode provision -ProductionQualifier -FixtureRoot (Join-Path $p 'q-profile') -WorkerRoot (Join-Path $p 'q-io') -RuntimeParent (Join-Path $p 'q-runtime-parent') -HostRoot (Join-Path $p 'q-host') -PeerPython $python -EnvFile "$env:GITHUB_ENV"
      - name: Compile original Lu workspace Protobuf contract before runtime freeze
        shell: pwsh
        run: |
          python -m research_tests.mel_lu_ipc01c.compile_pinned_lu_ssm --root "$PWD/cognitum/mel/vendor" --descriptor-out "$PWD/q-proto.desc" --receipt "$PWD/q-proto.json"
          if($LASTEXITCODE -ne 0){throw 'Reviewed original Lu workspace contract generation failed'}
      - name: Build complete pinned Python NumPy SciPy Cognitum runtime
        shell: pwsh
        run: |
          $p=Join-Path $PWD 'native/windows_scm_production/target'
          python scripts/cog_r5_r3_r1_bundle.py prepare --root (Join-Path $p 'q-runtime-parent/runtime') --repo "$PWD" | Set-Content q-runtime.json
          if($LASTEXITCODE -ne 0){throw 'Frozen math runtime unavailable'}
      - name: Original SSM request and independent expected output pin
        shell: pwsh
        run: |
          $p=Join-Path $PWD 'native/windows_scm_production/target'
          $hostRoot=Join-Path $p 'q-host'
          $io=Join-Path $p 'q-io'
          $runtime=Join-Path $p 'q-runtime-parent/runtime'
          python scripts/cog_r5_r1_scm_ssm_fixture.py prepare --root "$hostRoot" --worker-root "$io" --runtime-root "$runtime" --env-file "$env:GITHUB_ENV"
          if($LASTEXITCODE -ne 0){throw 'Original SSM vector missing'}
          python scripts/cog_r3r1_qualifier_pins.py probe
          if($LASTEXITCODE -ne 0){throw 'Frozen SSM import symbol diagnostic refused'}
          python scripts/cog_r5_r3_r1_bundle.py smoke --root "$runtime" --request (Join-Path $io 'input.frame') | Set-Content q-frozen-smoke.json
          if($LASTEXITCODE -ne 0){throw 'Original real mathematical smoke failed'}
          python scripts/cog_r3r1_qualifier_pins.py prepare
          if($LASTEXITCODE -ne 0){throw 'Independent numerical SHA unavailable'}
      - name: Provision disposable external nonexportable CNG key and pin immutable terminal paths
        id: cng
        shell: pwsh
        run: |
          $p=Join-Path $PWD 'native/windows_scm_production/target'
          $h=Join-Path $p 'q-host'
          & ./scripts/cog-r5-physical02-r2-cng-provision.ps1 -Mode provision -FixtureRoot $h -EnvFile "$env:GITHUB_ENV"
          $original=Get-Content -LiteralPath (Join-Path $h 'r2-external-provision.json') -Raw|ConvertFrom-Json
          if($original.schema -cne 'cognitum.ssm.r2.CI_external_KSP_enrollment.v1' -or
             $original.nonexportable_key_policy -ne $true -or
             $original.independent_production_publisher_approved -ne $false){
            throw 'No independent disposable original machine signer'
          }
          $values=@(
           "COG_PROD_QUAL_KSP_NAME=$($original.name)",
           "COG_PROD_QUAL_KSP_PUBLIC_SHA256=$($original.public_blob_sha256)",
           ("COG_PROD_QUAL_PRELAUNCH="+(Join-Path $h 'production-prelaunch.json')),
           ("COG_PROD_QUAL_TERMINAL="+(Join-Path $h 'production-terminal.json')),
           ("COG_PROD_QUAL_TERMINAL_SIGNED="+(Join-Path $h 'production-terminal-signed.json'))
          )
          [IO.File]::AppendAllText($env:GITHUB_ENV,($values -join [Environment]::NewLine)+[Environment]::NewLine)
      - name: Native SCM AppContainer qualifier compile, no installer mutation
        shell: pwsh
        run: |
          cargo build --manifest-path native/windows_scm_production/Cargo.toml --release --locked --offline --features protected-ssm-qualification
          if($LASTEXITCODE -ne 0){throw 'Feature-gated native SCM protected worker compile failed'}
          (Get-FileHash native/windows_scm_production/target/release/cognitum-scm-production.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content q-exe-sha.txt
      - name: Genuine SCM worker token and original Job before SSM execution
        shell: pwsh
        run: |
          $p=Join-Path $PWD 'native/windows_scm_production/target'
          & ./scripts/cog-r3r1-qualify-protected-ssm.ps1 -Executable (Join-Path $p 'release/cognitum-scm-production.exe') -WitnessRoot (Join-Path $p 'q-host') -WorkerRoot (Join-Path $p 'q-io') -EvidencePath "$PWD/q-scm-receipt.json"
      - name: Independently recompute same numerical answer, verify no release
        shell: pwsh
        run: |
          python scripts/cog_r3r1_qualifier_pins.py verify
          if($LASTEXITCODE -ne 0){throw 'Numerical result recomputation failed'}
      - name: Independently verify externally signed terminal bytes and reject tampering
        shell: pwsh
        run: |
          python scripts/cog_r3r1_qualifier_cng_verify.py | Set-Content q-cng-audit.json
          if($LASTEXITCODE -ne 0){throw 'External CNG terminal signature/Job receipt audit refused'}
      - name: Classify actual SCM second-start and uncertain partial terminal recovery
        shell: pwsh
        run: |
          python scripts/cog_r3r1_qualifier_recovery_verify.py | Set-Content q-recovery-matrix.json
          if($LASTEXITCODE -ne 0){throw 'Original restart/uncertain/replay fail-closed audit refused'}
      - name: Revoke disposable peer, profile and DPAPI account
        if: always() && steps.user.outcome == 'success'
        shell: pwsh
        run: |
          $p=Join-Path $PWD 'native/windows_scm_production/target'
          & ./scripts/cog-r5-physical02-r3-r1-nonadmin.ps1 -Mode remove -ProductionQualifier -FixtureRoot (Join-Path $p 'q-profile') -WorkerRoot (Join-Path $p 'q-io') -RuntimeParent (Join-Path $p 'q-runtime-parent')
      - name: Revoke original disposable machine CNG signing key
        if: always()
        shell: pwsh
        run: |
          $h=Join-Path $PWD 'native/windows_scm_production/target/q-host'
          if(Test-Path -LiteralPath (Join-Path $h 'r2-external-provision.json') -PathType Leaf){
            & ./scripts/cog-r5-physical02-r2-cng-provision.ps1 -Mode remove -FixtureRoot $h
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog-protected-ssm-source-lineage
          path: |
            q-runtime.json
            q-exe-sha.txt
            q-frozen-smoke.json
            q-scm-receipt.json
            q-cng-audit.json
            q-recovery-matrix.json
            native/windows_scm_production/target/q-expected.json
            native/windows_scm_production/target/q-host/r3-original-appcontainer-witness.json
            native/windows_scm_production/target/q-host/production-qualification.json
            native/windows_scm_production/target/q-host/production-prelaunch.json
            native/windows_scm_production/target/q-host/production-terminal.json
            native/windows_scm_production/target/q-host/production-terminal-signed.json
            native/windows_scm_production/target/q-host/r2-public-p256.blob
            native/windows_scm_production/target/q-io/input.frame
            native/windows_scm_production/target/q-io/output.frame
          if-no-files-found: warn
