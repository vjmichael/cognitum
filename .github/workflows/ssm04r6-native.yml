name: Cognitum SSM-04-R6 authenticated durable checkpoint native qualification

on:
  push:
    branches:
      - research/ssm04r6-authenticated-checkpoints-20261121
    paths:
      - '.github/workflows/ssm04r6-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-ssm04r6-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: SSM-04-R6 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pin native numerical dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 protobuf==6.33.1
      - name: Original SSM R0 through R5 and R6 authenticated deterministic recovery regression
        run: python -m pytest -q research_tests/ssm04 research_tests/ssm04r1 research_tests/ssm04r2 research_tests/ssm04r3 research_tests/ssm04r4 research_tests/ssm04r5 research_tests/ssm04r6 --junitxml=ssm04r6-native.xml
      - name: Confirm unchanged accepted source and new authenticated checkpoint Git blobs
        shell: bash
        run: |
          git rev-parse HEAD > ssm04r6-source-sha.txt
          git hash-object cognitum/research/ssm_stochastic.py cognitum/research/ssm_stochastic_extended.py cognitum/research/ssm_stochastic_continuous.py cognitum/research/ssm_stochastic_increments.py research_tests/ssm04r2/test_continuous.py research_tests/ssm04r3/test_increments.py cognitum/research/ssm_stochastic_smoothing.py research_tests/ssm04r4/test_correlated_smoothing.py cognitum/research/ssm_stochastic_streaming.py research_tests/ssm04r5/test_streaming.py cognitum/research/ssm_stochastic_checkpoints.py research_tests/ssm04r6/test_checkpoints.py > ssm04r6-source-blobs.txt
          test "$(git hash-object cognitum/research/ssm_stochastic.py)" = "e6616d14f4b02bd447f872f2a67a444d83bc7df6"
          test "$(git hash-object cognitum/research/ssm_stochastic_extended.py)" = "19aefcc2c01ff629f6da5778b12fa0d495a3b610"
          test "$(git hash-object cognitum/research/ssm_stochastic_continuous.py)" = "026ee4e3b9e4e8be7d0158b9e8771bb691809293"
          test "$(git hash-object cognitum/research/ssm_stochastic_increments.py)" = "3eebcec1da8bae1cb3a65d33aab389c584cff89b"
          test "$(git hash-object research_tests/ssm04r2/test_continuous.py)" = "8b8b16a9f3a3355cadd8ac7b19bf05af097e737a"
          test "$(git hash-object research_tests/ssm04r3/test_increments.py)" = "ee311ead4b017e0e080f41cf412d22bfff0139b3"
          test "$(git hash-object cognitum/research/ssm_stochastic_smoothing.py)" = "bc657af3ba28474c72bbb34376739f6bdef82106"
          test "$(git hash-object research_tests/ssm04r4/test_correlated_smoothing.py)" = "f9cc09a3a54308135d6f25f63904d18d0d3ff6f8"
          test "$(git hash-object cognitum/research/ssm_stochastic_streaming.py)" = "731208b392d3a948ee7677c2e24f1117e2c8df79"
          test "$(git hash-object research_tests/ssm04r5/test_streaming.py)" = "826e1a7402cf89ae5c8855cbe52fd8280617c73a"
          test "$(git hash-object cognitum/research/ssm_stochastic_checkpoints.py)" = "30773bfaf4871bf686df0690419e3244c380be03"
          test "$(git hash-object research_tests/ssm04r6/test_checkpoints.py)" = "23ae54dc6a8c47e2230df98af58d4eba3808ba77"
          test "$(git hash-object cognitum/research/ssm_stochastic.py)" = "$(git rev-parse HEAD:cognitum/research/ssm_stochastic.py)"
          test "$(git hash-object cognitum/research/ssm_stochastic_extended.py)" = "$(git rev-parse HEAD:cognitum/research/ssm_stochastic_extended.py)"
          test "$(git hash-object cognitum/research/ssm_stochastic_continuous.py)" = "$(git rev-parse HEAD:cognitum/research/ssm_stochastic_continuous.py)"
          test "$(git hash-object cognitum/research/ssm_stochastic_increments.py)" = "$(git rev-parse HEAD:cognitum/research/ssm_stochastic_increments.py)"
          test "$(git hash-object research_tests/ssm04r2/test_continuous.py)" = "$(git rev-parse HEAD:research_tests/ssm04r2/test_continuous.py)"
          test "$(git hash-object research_tests/ssm04r3/test_increments.py)" = "$(git rev-parse HEAD:research_tests/ssm04r3/test_increments.py)"
          test "$(git hash-object cognitum/research/ssm_stochastic_smoothing.py)" = "$(git rev-parse HEAD:cognitum/research/ssm_stochastic_smoothing.py)"
          test "$(git hash-object research_tests/ssm04r4/test_correlated_smoothing.py)" = "$(git rev-parse HEAD:research_tests/ssm04r4/test_correlated_smoothing.py)"
          test "$(git hash-object cognitum/research/ssm_stochastic_streaming.py)" = "$(git rev-parse HEAD:cognitum/research/ssm_stochastic_streaming.py)"
          test "$(git hash-object research_tests/ssm04r5/test_streaming.py)" = "$(git rev-parse HEAD:research_tests/ssm04r5/test_streaming.py)"
          test "$(git hash-object cognitum/research/ssm_stochastic_checkpoints.py)" = "$(git rev-parse HEAD:cognitum/research/ssm_stochastic_checkpoints.py)"
          test "$(git hash-object research_tests/ssm04r6/test_checkpoints.py)" = "$(git rev-parse HEAD:research_tests/ssm04r6/test_checkpoints.py)"
      - name: Preserve exact-SHA original JUnit and Git file identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog05-ssm04r6-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ssm04r6-native.xml
            ssm04r6-source-sha.txt
            ssm04r6-source-blobs.txt
          if-no-files-found: warn

  independent:
    name: Reconcile four native original JUnits and R3-R6 Git source identities
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cog05-ssm04r6-*
          path: original-native-evidence
          merge-multiple: false
      - name: Independently compare original JUnit cases, Git file hashes and exact source SHA
        shell: bash
        env:
          LOCK_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,json,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('original-native-evidence')
          expected={f'cog05-ssm04r6-{system}-py{py}'
                    for system in ('ubuntu-latest','windows-latest')
                    for py in ('3.11','3.13')}
          assert {p.name for p in root.iterdir() if p.is_dir()}==expected
          blobs=["e6616d14f4b02bd447f872f2a67a444d83bc7df6","19aefcc2c01ff629f6da5778b12fa0d495a3b610","026ee4e3b9e4e8be7d0158b9e8771bb691809293","3eebcec1da8bae1cb3a65d33aab389c584cff89b","8b8b16a9f3a3355cadd8ac7b19bf05af097e737a","ee311ead4b017e0e080f41cf412d22bfff0139b3","bc657af3ba28474c72bbb34376739f6bdef82106","f9cc09a3a54308135d6f25f63904d18d0d3ff6f8","731208b392d3a948ee7677c2e24f1117e2c8df79","826e1a7402cf89ae5c8855cbe52fd8280617c73a","30773bfaf4871bf686df0690419e3244c380be03","23ae54dc6a8c47e2230df98af58d4eba3808ba77"]
          cases0=None
          counts={}
          for folder in sorted(root.iterdir()):
              assert folder.is_dir()
              assert (folder/'ssm04r6-source-sha.txt').read_text().strip()==os.environ['LOCK_SHA']
              assert (folder/'ssm04r6-source-blobs.txt').read_text().splitlines()==blobs
              cases=list(ET.parse(folder/'ssm04r6-native.xml').getroot().iter('testcase'))
              assert len(cases)==199, (folder.name,len(cases))
              assert not any(c.find(tag) is not None for c in cases
                             for tag in ('failure','error','skipped'))
              names=sorted((c.get('classname'),c.get('name')) for c in cases)
              assert len(set(names))==len(names)
              if cases0 is None:cases0=names
              else:assert names==cases0
              assert sum('ssm04r6' in name for cls,name in names)>=6
              counts[folder.name]=len(cases)
          result={
              'schema':'cognitum.ssm04r6.independent.four_native_original_receipt.v1',
              'status':'PASS_AUTHENTICATED_DETERMINISTIC_CHECKPOINTS_AND_LEGACY_SOURCE',
              'source_sha':os.environ['LOCK_SHA'],
              'native_platform_count':len(counts),
              'tests_per_platform':counts,
              'all_12_original_git_blobs_identical':True,
              'original_JUnit_case_names_identical':True,
              'installed_MEL_execution_authorized':False,
              'os_credential_broker_qualified':False,
              'external_exactly_once_journal_integrated':False,
              'certified_covariance_enclosure':False,
          }
          Path('ssm04r6-independent-native.json').write_text(
              json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Preserve independent comparison receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog05-ssm04r6-independent-native
          path: ssm04r6-independent-native.json
          if-no-files-found: warn
