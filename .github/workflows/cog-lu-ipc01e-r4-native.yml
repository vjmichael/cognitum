name: Cognitum IPC-01E R4 fixed SSM OS protected original operation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cog-lu-ipc01e-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Protected SSM native / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned native Protobuf and math libraries
        run: python -m pip install grpcio-tools==1.76.0 protobuf==6.33.1 numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 cryptography==46.0.3
      - name: Independently compile original Lu workspace and Cognitum SSM Protobuf
        shell: bash
        run: |
          python -m research_tests.mel_lu_ipc01c.compile_pinned_lu_ssm \
            --root "$GITHUB_WORKSPACE/cognitum/mel/vendor" \
            --descriptor-out "$GITHUB_WORKSPACE/cog-lu-ipc01e-r4.desc" \
            --receipt "$GITHUB_WORKSPACE/cog-lu-ipc01e-r4-proto.json"
      - name: Compile R4 sources and execute existing IPC R6 and protected worker tests
        run: |
          python -m compileall -q cognitum/mel/ssm_r4_protected.py cognitum/mel/ssm_supervisor.py cognitum/mel/ssm_recovery.py research_tests/mel_lu_ipc01e_r4
          python -m pytest -q research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py research_tests/mel_lu_ipc01b/test_native_carriers.py research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py research_tests/mel_lu_ipc01d/test_durable_lifecycle.py research_tests/mel_lu_ipc01e/test_outbox_reconcile.py research_tests/mel_ssm_r6int02/test_native_host.py research_tests/mel_lu_ipc01e_r2/test_native_custody_signed_receipt.py research_tests/mel_lu_ipc01e_r3/test_installed_host_prerequisites.py research_tests/mel_lu_ipc01e_r4/test_bound_protected_ssm.py --junitxml=cog-lu-ipc01e-r4-native.xml
      - name: Persist exact source SHA and bounded source Git blob pins
        shell: bash
        if: always()
        run: |
          git rev-parse HEAD > cog-lu-ipc01e-r4-source-sha.txt
          git hash-object cognitum/mel/ssm_r4_protected.py cognitum/mel/ssm_supervisor.py cognitum/mel/ssm_recovery.py research_tests/mel_lu_ipc01e_r4/test_bound_protected_ssm.py > cog-lu-ipc01e-r4-source-blobs.txt
      - name: Retain test and custody source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog-lu-ipc01e-r4-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            cog-lu-ipc01e-r4-native.xml
            cog-lu-ipc01e-r4-source-sha.txt
            cog-lu-ipc01e-r4-source-blobs.txt
            cog-lu-ipc01e-r4.desc
            cog-lu-ipc01e-r4-proto.json
          if-no-files-found: warn

  independent:
    name: Reconcile original cross-OS source and non-authority receipts
    runs-on: ubuntu-latest
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cog-lu-ipc01e-r4-*
          path: original-native
          merge-multiple: false
      - name: Require exact source Git blob pins and all original tests
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('original-native')
          expected={f"cog-lu-ipc01e-r4-{os}-py{version}" for os in
                    ('ubuntu-latest','windows-latest') for version in ('3.11','3.13')}
          assert {p.name for p in root.iterdir()}==expected
          files=('cognitum/mel/ssm_r4_protected.py',
                 'cognitum/mel/ssm_supervisor.py',
                 'cognitum/mel/ssm_recovery.py',
                 'research_tests/mel_lu_ipc01e_r4/test_bound_protected_ssm.py')
          pins=[]
          for path in files:
              raw=Path(path).read_bytes()
              pins.append(hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest())
          refs=None;counts={}
          for folder in sorted(root.iterdir()):
              assert (folder/'cog-lu-ipc01e-r4-source-sha.txt').read_text().strip()==os.environ['SOURCE_SHA']
              assert (folder/'cog-lu-ipc01e-r4-source-blobs.txt').read_text().splitlines()==pins
              meta=json.loads((folder/'cog-lu-ipc01e-r4-proto.json').read_text())
              assert meta['exact_lu_workspace_proto_preserved']
              assert meta['cognitum_domain_proto_compiled']
              assert not meta['genuine_installed_lu_core_connected']
              tests=list(ET.parse(folder/'cog-lu-ipc01e-r4-native.xml').getroot().iter('testcase'))
              assert len(tests)>=215
              assert not any(c.find(s) is not None for c in tests for s in ('failure','error','skipped'))
              ids=sorted((c.get('classname'),c.get('name')) for c in tests)
              assert len(set(ids))==len(ids)
              if refs is None: refs=ids
              else: assert refs==ids
              counts[folder.name]=len(ids)
          evidence={
            'schema':'cognitum.lu_ipc01e_r4.protected_source_evidence.v1',
            'status':'PASS_ORIGINAL_OS_NATIVE_FIXED_SSM_SOURCE_ONLY',
            'exact_source_sha':os.environ['SOURCE_SHA'],
            'all_source_git_blob_pins_match':True,
            'cross_os_native_case_identities_identical':True,
            'case_counts':counts,
            'real_lu_core_installed_health':False,
            'real_lu_core_per_turn_pure_compute_grant':False,
            'independently_signed_installed_executor_stop_receipt':False,
            'installed_ssm_service_worker_publisher_verified':False,
            'independent_hardware_remote_rollback_anchor':False,
            'external_output_delivery_or_acknowledgment':False,
            'model_tool_execution_authorized':False,
          }
          Path('cog-lu-ipc01e-r4-independent.json').write_text(
              json.dumps(evidence,sort_keys=True,indent=2)+'\n')
          print(json.dumps(evidence,sort_keys=True))
          PY
      - name: Preserve exact source independent native receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog-lu-ipc01e-r4-independent
          path: cog-lu-ipc01e-r4-independent.json
          if-no-files-found: warn
