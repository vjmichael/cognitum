name: Cognitum Python regression

on:
  push:
    branches:
      - main
      - 'cognitum/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional Protobuf dependencies and compiler
        run: python -m pip install -e ".[security,scientific,causal-stats,planning-graph,probability-stats,optimization-schedule,optimization-mip,temporal-learned]" "grpcio-tools>=1.70,<2" "jsonschema>=4,<5" "pytest==9.0.2"
      - name: Require actual graph and diagnostics backends
        run: |
          python -m pip check
          python -c "import networkx; from cognitum.probability_diagnostics import _diagnostics_backend; az, version = _diagnostics_backend(); print(networkx.__version__, version)"
      - name: Compile and compare native Protobuf schema
        run: |
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_cognitum.pb proto/cognitum/v1/capability.proto
          python tools/check_proto_descriptors.py compiled_cognitum.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_cognitum_handoff.pb proto/cognitum/v1/ce_handoff.proto
          python tools/check_proto_descriptors.py compiled_cognitum_handoff.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_worker.pb proto/cognitum/worker/v1/worker.proto
          python tools/check_proto_descriptors.py compiled_worker.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_supervisor.pb proto/cognitum/security/v1/supervisor_acceptance.proto
          python tools/check_proto_descriptors.py compiled_supervisor.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_evaluation.pb proto/cognitum/eval/v1/evaluation.proto
          python tools/check_proto_descriptors.py compiled_evaluation.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_benchmark.pb proto/cognitum/benchmark/v1/benchmark.proto
          python tools/check_proto_descriptors.py compiled_benchmark.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_collector.pb proto/cognitum/benchmark/v1/collector.proto
          python tools/check_proto_descriptors.py compiled_collector.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_specialists.pb proto/cognitum/math/v1/specialists.proto
          python tools/check_proto_descriptors.py compiled_specialists.pb
      - name: Verify core tests
        run: python -m tools.run_crossplatform_regression
      - name: MEL-07A native CPU routing, fidelity and resource benchmark
        run: python -m tools.mel07a_cpu --out mel07a-evidence/qualification.json --repeats 3
      - name: MEL-07A-R1 polynomial, batching and cooperative CPU qualification
        run: python -m tools.mel07a_r1 --out mel07ar1-evidence
      - name: MEL-07A-R2 bounded batching and per-worker native counters
        run: python -m tools.mel07a_r2 --out mel07ar2-evidence
      - name: MEL-07A-R3 resource-aware batch planning and held-out execution
        run: python -m tools.mel07a_r3 --calibration mel07ar2-evidence/qualification.json --out mel07ar3-evidence
      - name: COG-04O exact tensor functional metrics and independent oracle
        run: python -m tools.cog04o.acceptance --prior mel07ar1-evidence --out cog04o-evidence
      - name: COG-04P exact weak forms, independent spectra and measured resources
        run: python -m tools.cog04p.acceptance --prior cog04o-evidence --out cog04p-evidence
      - name: COG-04Q adaptive continuum Ritz approximation and convergence
        run: python -m tools.cog04q.acceptance --prior cog04p-evidence --out cog04q-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-04R Sturm-Liouville operators and separated boundary convergence
        run: python -m tools.cog04r.acceptance --prior cog04q-evidence --out cog04r-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-04S separable tensor continuum eigenproblems
        run: python -m tools.cog04s.acceptance --prior cog04r-evidence --out cog04s-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-04T coupled non-self-adjoint continuum eigenproblems
        run: python -m tools.cog04t.acceptance --prior cog04s-evidence --out cog04t-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-04U certified scalar continuum enclosures and exact assembly optimization
        run: python -m tools.cog04u.acceptance --prior cog04t-evidence --out cog04u-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-05C frozen mathematical conformance and accepted control qualification
        run: python -m tools.cog05c.qualification --prior cog04u-evidence --out cog05c-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-05-SSM-01 exact coupled linear foundations and C17 preservation
        run: python -m tools.ssm01.acceptance --prior cog05c-evidence --out ssm01-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-05-SSM-02 exact linear systems analysis, Lyapunov and Riccati qualification
        run: python -m tools.ssm02.acceptance --prior ssm01-evidence --out ssm02-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-05-SSM-02-R1 nonlinear analysis and exact bounded verification
        run: python -m tools.ssm02r1.acceptance --prior ssm02-evidence --out ssm02r1-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: COG-05-SSM-03 scientific dynamics and structure-preserving integration
        run: python -m tools.ssm03.acceptance --prior ssm02r1-evidence --out ssm03-evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - name: Preserve SSM-03 native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssm03-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ssm03-evidence/
          if-no-files-found: warn
      - name: COG-05-SSM-03-R1 extended scientific dynamics
        run: python -m tools.ssm03r1.acceptance --prior ssm03-evidence --out ssm03r1-evidence
