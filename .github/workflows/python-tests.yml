name: Cognitum Python regression

on:
  push:
    branches:
      - main
      - 'cognitum/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional Protobuf dependencies and compiler
        run: python -m pip install -e ".[security,scientific]" "grpcio-tools>=1.70,<2" "jsonschema>=4,<5" "pytest==9.0.2"
      - name: Compile and compare native Protobuf schema
        run: |
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_cognitum.pb proto/cognitum/v1/capability.proto
          python tools/check_proto_descriptors.py compiled_cognitum.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_cognitum_handoff.pb proto/cognitum/v1/ce_handoff.proto
          python tools/check_proto_descriptors.py compiled_cognitum_handoff.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_worker.pb proto/cognitum/worker/v1/worker.proto
          python tools/check_proto_descriptors.py compiled_worker.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_supervisor.pb proto/cognitum/security/v1/supervisor_acceptance.proto
          python tools/check_proto_descriptors.py compiled_supervisor.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_evaluation.pb proto/cognitum/eval/v1/evaluation.proto
          python tools/check_proto_descriptors.py compiled_evaluation.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_benchmark.pb proto/cognitum/benchmark/v1/benchmark.proto
          python tools/check_proto_descriptors.py compiled_benchmark.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_collector.pb proto/cognitum/benchmark/v1/collector.proto
          python tools/check_proto_descriptors.py compiled_collector.pb
          python -m grpc_tools.protoc -Iproto --descriptor_set_out=compiled_specialists.pb proto/cognitum/math/v1/specialists.proto
          python tools/check_proto_descriptors.py compiled_specialists.pb
      - name: Verify core tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify synthetic replay
        run: python -m cognitum --calculator replay evals/smoke.json
      - name: Verify deterministic C03 synthetic evaluation (no Lu model)
        run: python tools/run_c03_smoke.py --check
      - name: Check source compilation
        run: python -m compileall -q cognitum tests
