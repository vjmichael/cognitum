name: Cognitum C16 bounded physics reference
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c16-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core, Protobuf and pytest
        run: python -m pip install --no-deps -e . protobuf==6.33.6 pytest==9.0.2
      - name: C16 exact analytical motion and negative Protobuf tests
        run: python -m pytest -q tests/test_c16_p1_analytic_motion.py
  compiler-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install compiler and Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python -m pip install protobuf==6.33.6
      - name: Require all registered Protobuf sources to match checked-in bindings
        run: python tools/verify_protobuf_schemas.py --require
