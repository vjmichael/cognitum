name: C15 real MOT17 public-detection acceptance (research-only)
on:
  push:
    branches-ignore: [development/cog-06-cooperative-reasoning-20261116]
    paths:
      - 'tools/c15_real_mot_acceptance.py'
      - 'tools/c15_stage_trackeval.py'
      - 'tests/test_c15_real_mot_acceptance.py'
      - 'tests/test_c15_official_metrics_comparison.py'
      - 'tools/c15_compare_official_trackeval.py'
      - 'tools/c15_trackeval_numpy_compat.py'
      - 'tools/c15_trackeval_pinned_compat.py'
      - 'tools/c15_trackeval_parity.py'
      - 'tests/test_c15_trackeval_pinned_compat.py'
      - 'tests/test_c15_trackeval_numpy_compat.py'
      - 'docs/components/spatial/C15-CROSSPLATFORM-REALDATA-ACCEPTANCE-2026-11-04.md'
      - '.github/workflows/c15-real-mot17.yml'
  pull_request:
    paths:
      - 'tools/c15_real_mot_acceptance.py'
      - 'tools/c15_stage_trackeval.py'
      - 'tests/test_c15_real_mot_acceptance.py'
      - 'docs/components/spatial/C15-CROSSPLATFORM-REALDATA-ACCEPTANCE-2026-11-04.md'
      - '.github/workflows/c15-real-mot17.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an in-progress long benchmark finish despite newer branch pushes.
  # GitHub may still replace an older pending request with a newer one.
  cancel-in-progress: false

jobs:
  real-public-mot17:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COG06B_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify frozen Cognitum source
        run: test "$(git rev-parse HEAD)" = "$COG06B_EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual tracking, SciPy and evaluation engines
        run: |
          python -m pip install -e ".[spatial-core]" trackers==2.6.1 tabulate==0.9.0
          python -m pip check
      - name: Retrieve public benchmark detections and annotations ONLY
        run: |
          trackers download mot17 --split val --asset annotations,detections --output mot_data
          test -s mot_data/mot17/val/MOT17-02-FRCNN/gt/gt.txt
          test -s mot_data/mot17/val/MOT17-02-FRCNN/det/det.txt
      - name: Run actual Cognitum tracker BEFORE loading ground truth
        run: |
          mkdir -p evidence
          python tools/c15_real_mot_acceptance.py \
            --gt mot_data/mot17/val/MOT17-02-FRCNN/gt/gt.txt \
            --det mot_data/mot17/val/MOT17-02-FRCNN/det/det.txt \
            --output evidence/c15-MOT17-02-FRCNN.txt \
            --sequence MOT17-02-FRCNN --i-have-dataset-rights \
            > evidence/c15-diagnostic.json
          cat evidence/c15-diagnostic.json
      - name: Evaluate actual C15 predictions using standard MOT metrics
        run: |
          trackers eval \
            --gt mot_data/mot17/val/MOT17-02-FRCNN/gt/gt.txt \
            --tracker evidence/c15-MOT17-02-FRCNN.txt \
            --metrics CLEAR HOTA Identity \
            --columns MOTA HOTA IDF1 \
            --output evidence/c15-real-mot17-scores.json
          test -s evidence/c15-real-mot17-scores.json
      - name: Conventional ByteTrack comparison on identical public detections
        run: |
          trackers track \
            --detections mot_data/mot17/val/MOT17-02-FRCNN/det/det.txt \
            --tracker bytetrack \
            --mot-output evidence/bytetrack-MOT17-02-FRCNN.txt
          trackers eval \
            --gt mot_data/mot17/val/MOT17-02-FRCNN/gt/gt.txt \
            --tracker evidence/bytetrack-MOT17-02-FRCNN.txt \
            --metrics CLEAR HOTA Identity \
            --columns MOTA HOTA IDF1 \
            --output evidence/bytetrack-real-mot17-scores.json
          test -s evidence/bytetrack-real-mot17-scores.json
      - name: Check out pinned MOTChallenge official TrackEval source
        uses: actions/checkout@v4
        with:
          repository: JonathonLuiten/TrackEval
          ref: 12c8791b303e0a0b50f753af204249e622d0281a
          path: official-trackeval
          persist-credentials: false
      - name: Verify old and strict pinned compatibility guards
        run: python -m unittest tests.test_c15_trackeval_numpy_compat tests.test_c15_trackeval_pinned_compat -v
      - name: Verify complete clean pinned upstream source
        run: |
          test "$(git -C official-trackeval rev-parse HEAD)" = 12c8791b303e0a0b50f753af204249e622d0281a
          test -z "$(git -C official-trackeval status --porcelain)"
      - name: Stage the two frozen tracker outputs for independent official evaluator
        run: |
          python -m pip install tabulate
          python tools/c15_stage_trackeval.py \
            --root "$PWD/official-stage" \
            --gt "$PWD/mot_data/mot17/val/MOT17-02-FRCNN/gt/gt.txt" \
            --c15 "$PWD/evidence/c15-MOT17-02-FRCNN.txt" \
            --bytetrack "$PWD/evidence/bytetrack-MOT17-02-FRCNN.txt" \
            | tee evidence/trackeval-staging-audit.txt
      - name: Compare unmodified legacy dtype semantics to exact repaired pinned evaluator
        run: |
          python -m tools.c15_trackeval_parity \
            --root "$PWD/official-trackeval" \
            --stage "$PWD/official-stage" \
            --evidence "$PWD/evidence"
          test -s evidence/trackeval-parity.json
          test -s evidence/trackeval-C15-summary.txt
          test -s evidence/trackeval-ByteTrack-summary.txt
      - name: Validate official summary extractor against known synthetic fixtures
        run: python -m unittest tests.test_c15_official_metrics_comparison -v
      - name: Record actual matched official HOTA MOTA and IDF1 comparison
        run: |
          python tools/c15_compare_official_trackeval.py \
            --c15 evidence/trackeval-C15-summary.txt \
            --bytetrack evidence/trackeval-ByteTrack-summary.txt \
            --output evidence/trackeval-c15-vs-bytetrack.json
          test -s evidence/trackeval-c15-vs-bytetrack.json
      - name: Verify frozen Cognitum source again
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$COG06B_EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload bounded evaluation evidence, not licensed image/dataset files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c15-real-mot17-research-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
