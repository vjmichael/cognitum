name: Cognitum BENCH-02 R3 pre-result cohort qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-orcbench02-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-source-cohorts:
    name: Original source and causal cohorts / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Checkout unchanged preregistered source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact test runner
        run: python -m pip install pytest==9.0.2
      - name: Execute original R1 R2 and frozen R3 source/refusal tests
        run: python -m pytest -q tests/test_orc_bench02_availability.py tests/test_orc_bench02_acquisition.py tests/test_orc_bench02_cohorts.py --junitxml=bench02-r3.xml
      - name: Emit locked protocol summary without evaluating any forecasting model
        shell: bash
        run: |
          python -m tools.orcbench02.cohorts > bench02-r3-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          source=Path("docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json").read_bytes()
          assert sha256(source).hexdigest()=="fd0b6a372ee5cd9ee8870ad20c475261460a069daf4fd52f56e8dcc2961a5104"
          report=json.loads(Path("bench02-r3-summary.json").read_bytes())
          assert report["forecast_models_fitted"] is False
          assert report["heldout_scores_computed"] is False
          assert report["strict_causal_claim_approved"] is False
          PY
      - name: Preserve identical original Git source locks
        shell: bash
        run: |
          git rev-parse HEAD > source-sha.txt
          git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json tools/orcbench02/cohorts.py tests/test_orc_bench02_cohorts.py docs/research/orcgraph/ORCH01E_BENCH02_R3.md tools/orcbench02/acquisition.py > source-blobs.txt
      - name: Archive evidence including actual unmodified JUnit identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbench02-r3-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            bench02-r3.xml
            bench02-r3-summary.json
            source-sha.txt
            source-blobs.txt
          if-no-files-found: warn
