name: Cognitum BENCH-02 R4 frozen retrospective ridge versus Orc policy

on:
  push:
    branches:
      - research/orc-bench02-r4-frozen-20261120
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-orc-bench02-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-frozen:
    name: Matched original NOAA cohorts / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout unchanged source and original NOAA snapshots
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exact local numerical and test dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest==9.0.2
      - name: Source-locked unchanged R1 R2 R3 and R4 pretest tests
        run: python -m pytest -q tests/test_orc_bench02_availability.py tests/test_orc_bench02_acquisition.py tests/test_orc_bench02_cohorts.py tests/test_orc_bench02_capture_r3.py tests/test_orc_bench02_r4_pretest.py --junitxml=bench02-r4-pretest.xml
      - name: Create calibration-only original method decision before test scoring
        run: python -m tools.orcbench02.benchmark_r4 --phase freeze --decisions bench02-r4-decisions.json
      - name: Enforce original decisions, then score every matched heldout row
        run: python -m tools.orcbench02.benchmark_r4 --phase score --decisions bench02-r4-decisions.json --output bench02-r4-results.json
      - name: Independent source-row, paired-score, loss and refusal replay
        run: python -m pytest -q tests/test_orc_bench02_r4_results.py --junitxml=bench02-r4-result-verification.xml
      - name: Confirm exact source/protocol identities and no native checkout translation
        shell: bash
        run: |
          git rev-parse HEAD > source-sha.txt
          git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R4_PREREG.json tools/orcbench02/benchmark_r4.py tests/test_orc_bench02_r4_pretest.py tests/test_orc_bench02_r4_results.py tools/orcbench02/cohorts.py docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json > source-blobs.txt
          for f in docs/research/orcgraph/ORCH01E_BENCH02_R4_PREREG.json tools/orcbench02/benchmark_r4.py tests/test_orc_bench02_r4_pretest.py tests/test_orc_bench02_r4_results.py tools/orcbench02/cohorts.py docs/research/orcgraph/ORCH01E_BENCH02_R3_PREREG.json; do
            observed=$(git hash-object "$f")
            canonical=$(git rev-parse "HEAD:$f")
            if [ "$observed" != "$canonical" ]; then
              echo "Refuse CRLF/source-byte mutation: $f"
              exit 1
            fi
          done
          test "$(git hash-object docs/research/orcgraph/ORCH01E_BENCH02_R4_PREREG.json)" = "1cf7c2ae11e09130ef036f3812ebfb849235f26b"
      - name: Archive actual signed-in CI source identities and both phases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcbench02-r4-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            bench02-r4-pretest.xml
            bench02-r4-result-verification.xml
            bench02-r4-decisions.json
            bench02-r4-results.json
            source-sha.txt
            source-blobs.txt
          if-no-files-found: warn
