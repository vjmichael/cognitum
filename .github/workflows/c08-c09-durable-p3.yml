name: Cognitum C08 C09 durable integrity P3 reference
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional research dependencies
        run: python -m pip install 'protobuf==6.33.6' 'numpy==2.2.6' 'cryptography==46.0.4' 'pytest==9.0.2'
      - name: Persistent source epoch and KAN revocation regression
        run: python -m pytest -q tests/test_research_durable.py tests/test_c08_index_lifecycle.py tests/test_c09_signed_approval.py tests/test_research_optional.py
