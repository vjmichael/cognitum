name: Cognitum alpha durable P3 reference
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install protobuf and test runner
        run: python -m pip install 'protobuf==6.33.6' 'pytest==9.0.2'
      - name: Local SQLite durability and native worker regression
        run: python -m pytest -q tests/test_alpha_durable.py tests/test_alpha_lifecycle.py tests/test_alpha_native.py
