name: Cognitum R5 PHYSICAL-01 native SCM and cgroup readiness refusals

on:
  push:
    branches:
      - integration/cog-lu-ipc01e-r2-custody-20261121
    paths:
      - .github/workflows/cog-lu-ipc01e-r5-physical01-native.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-r5-physical01-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Read-only installed-host readiness / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned native SSM and test dependencies
        run: python -m pip install grpcio-tools==1.76.0 protobuf==6.33.1 numpy==2.2.6 scipy==1.15.3 pytest==9.0.2 cryptography==46.0.3
      - name: Compile original pinned workspace and typed SSM Protobuf
        shell: bash
        run: |
          python -m research_tests.mel_lu_ipc01c.compile_pinned_lu_ssm \
            --root "$GITHUB_WORKSPACE/cognitum/mel/vendor" \
            --descriptor-out "$GITHUB_WORKSPACE/r5-physical01.desc" \
            --receipt "$GITHUB_WORKSPACE/r5-physical01-proto.json"
      - name: Original R5 regression plus physical SCM/delegation refusal
        run: |
          python -m compileall -q cognitum/mel/ssm_r5_physical_inspection.py research_tests/mel_lu_ipc01e_r5/test_physical_inspection.py
          python -m pytest -q research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py research_tests/mel_lu_ipc01b/test_native_carriers.py research_tests/mel_lu_ipc01c/test_typed_ssm_contract.py research_tests/mel_lu_ipc01d/test_durable_lifecycle.py research_tests/mel_lu_ipc01e/test_outbox_reconcile.py research_tests/mel_ssm_r6int02/test_native_host.py research_tests/mel_lu_ipc01e_r2/test_native_custody_signed_receipt.py research_tests/mel_lu_ipc01e_r3/test_installed_host_prerequisites.py research_tests/mel_lu_ipc01e_r4/test_bound_protected_ssm.py research_tests/mel_lu_ipc01e_r5/test_windows_scm_and_external_stop.py research_tests/mel_lu_ipc01e_r5/test_linux_original_recovery.py research_tests/mel_lu_ipc01e_r5/test_physical_inspection.py --junitxml=r5-physical01-native.xml
      - name: Preserve original native source and three physical-probe pins
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > r5-physical01-source-sha.txt
          git hash-object cognitum/mel/ssm_r5_physical_inspection.py research_tests/mel_lu_ipc01e_r5/test_physical_inspection.py cognitum/mel/ssm_r5_windows_job.py cognitum/mel/ssm_r5_linux_recovery.py cognitum/mel/ssm_r5_stop_receipt.py > r5-physical01-source-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-physical01-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            r5-physical01-native.xml
            r5-physical01-source-sha.txt
            r5-physical01-source-blobs.txt
            r5-physical01.desc
            r5-physical01-proto.json
          if-no-files-found: warn

  independent:
    name: Verify exact native evidence and reject imaginary installed acceptance
    runs-on: ubuntu-latest
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: r5-physical01-*
          path: original-native
          merge-multiple: false
      - name: Cross-OS exact Git sources, JUnit cases and absent installed authority
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path("original-native")
          expected={f"r5-physical01-{target}-py{py}" for target in
                    ("ubuntu-latest","windows-latest") for py in ("3.11","3.13")}
          assert {p.name for p in root.iterdir()}==expected
          files=(
              "cognitum/mel/ssm_r5_physical_inspection.py",
              "research_tests/mel_lu_ipc01e_r5/test_physical_inspection.py",
              "cognitum/mel/ssm_r5_windows_job.py",
              "cognitum/mel/ssm_r5_linux_recovery.py",
              "cognitum/mel/ssm_r5_stop_receipt.py",
          )
          pins=[]
          for name in files:
              data=Path(name).read_bytes()
              pins.append(hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest())
          baseline=None;counts={}
          for folder in sorted(root.iterdir()):
              assert (folder/"r5-physical01-source-sha.txt").read_text().strip()==os.environ["SOURCE_SHA"]
              assert (folder/"r5-physical01-source-blobs.txt").read_text().splitlines()==pins
              proto=json.loads((folder/"r5-physical01-proto.json").read_text())
              assert proto["exact_lu_workspace_proto_preserved"]
              assert proto["cognitum_domain_proto_compiled"]
              assert not proto["genuine_installed_lu_core_connected"]
              cases=list(ET.parse(folder/"r5-physical01-native.xml").getroot().iter("testcase"))
              assert len(cases)>=250
              assert not any(t.find(kind) is not None for t in cases
                             for kind in ("failure","error","skipped"))
              ids=sorted((t.get("classname"),t.get("name")) for t in cases)
              assert len(ids)==len(set(ids))
              if baseline is None: baseline=ids
              else: assert ids==baseline
              counts[folder.name]=len(ids)
          result={
              "schema":"cognitum.r5_physical01.native_source_only.v1",
              "qualified_sha":os.environ["SOURCE_SHA"],
              "native_case_counts":counts,
              "exact_blob_pins_match":True,
              "cross_os_junit_identities_match":True,
              "native_scm_absent_refusal_tested":True,
              "linux_undelegated_refusal_tested":True,
              "physical_windows_scm_service_installed_and_signed":False,
              "physical_linux_delegated_cgroup_restart_qualified":False,
              "external_prod_stop_signer_authenticated":False,
              "installed_lu_core_health_authenticated":False,
              "installed_cognitum_core_enrollment":False,
              "production_pure_compute_grant":False,
              "outbox_release_or_ack_authorized":False,
              "native_source_only":True,
          }
          Path("r5-physical01-independent.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-physical01-independent
          path: r5-physical01-independent.json
          if-no-files-found: warn
