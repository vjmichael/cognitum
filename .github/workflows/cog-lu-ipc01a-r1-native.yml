name: Cognitum Lu IPC-01A-R1 pinned native protoc and authenticated health-only source gate

on:
  push:
    branches:
      - integration/cog-lu-ipc01a-r1-20261121
    paths:
      - '.github/workflows/cog-lu-ipc01a-r1-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cognitum-lu-ipc01a-r1-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Cognitum Lu IPC v0 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned native Protobuf compiler and MEL requirements
        run: python -m pip install grpcio-tools==1.76.0 protobuf==6.33.1 numpy==2.2.6 scipy==1.15.3 pytest==9.0.2
      - name: Verify exact Lu Git blob and compile genuine Protobuf Python/descriptor
        shell: bash
        run: |
          python -m research_tests.mel_lu_ipc01a.compile_pinned_proto \
            --root "$GITHUB_WORKSPACE/cognitum/mel/vendor" \
            --descriptor-out "$GITHUB_WORKSPACE/lu-ipc-v0.desc" \
            --receipt "$GITHUB_WORKSPACE/lu-ipc-v0-compile.json"
      - name: Execute five capability, native Protobuf handshake and fail-closed source cases
        run: python -m pytest -q research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py --junitxml=lu-ipc01a-r1-native.xml
      - name: Exact native source commit and 11 original blob identity locks
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > lu-ipc01a-r1-source-sha.txt
          git hash-object cognitum/mel/vendor/lu/workspace/v0/workspace.proto cognitum/mel/lu_workspace_contract.py cognitum/mel/lu_ipc_readonly.py cognitum/mel/lu_adapter.py cognitum/mel/admission.py cognitum/mel/native.py research_tests/mel_lu_ipc01a/compile_pinned_proto.py research_tests/mel_lu_ipc01a/test_workspace_contract.py research_tests/mel_lu_ipc01a/test_proto_client.py .gitattributes docs/integration/COG_LU_IPC_01A_R1_NATIVE.md > lu-ipc01a-r1-source-blobs.txt
          test "$(git hash-object cognitum/mel/vendor/lu/workspace/v0/workspace.proto)" = "4e01d921197fb1c58c99958479b1cede36e13c9a"
          test "$(git hash-object cognitum/mel/lu_workspace_contract.py)" = "ac57eb0afc4b2f0630531470e067461d8e2268ea"
          test "$(git hash-object cognitum/mel/lu_ipc_readonly.py)" = "b21612457c3763dab8233d0eced5e5fffca968ad"
          test "$(git hash-object cognitum/mel/lu_adapter.py)" = "300300b9f63f417afcc0ec650697e3012b7bdab0"
          test "$(git hash-object cognitum/mel/admission.py)" = "405fa91935f62226ab0d1a2f0d8b7313e2327116"
          test "$(git hash-object cognitum/mel/native.py)" = "2f8ccf40e7f1ead28edd3a1ffaee767b6e63b9a7"
          test "$(git hash-object research_tests/mel_lu_ipc01a/compile_pinned_proto.py)" = "8db687bd4912f92af3b505088e7683ca0df2a9b2"
          test "$(git hash-object research_tests/mel_lu_ipc01a/test_workspace_contract.py)" = "05e40e09c7a3e9bfdf838d38f4e971682ec8cfd2"
          test "$(git hash-object research_tests/mel_lu_ipc01a/test_proto_client.py)" = "64ca56b974d8b0d0b5e3d566e8c0c5bab36ee474"
          test "$(git hash-object .gitattributes)" = "11b7f7072328ff6a1ba8636c44eb1843d212e3d3"
          test "$(git hash-object docs/integration/COG_LU_IPC_01A_R1_NATIVE.md)" = "1c1d1c6c6d225457c188c705b5ce716fd20d870c"
      - name: Archive exact original native JUnit, protoc source and descriptor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitum-lu-ipc01a-r1-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            lu-ipc01a-r1-native.xml
            lu-ipc01a-r1-source-sha.txt
            lu-ipc01a-r1-source-blobs.txt
            lu-ipc-v0.desc
            lu-ipc-v0-compile.json
            cognitum/mel/vendor/lu/workspace/v0/workspace_pb2.py
          if-no-files-found: warn

  independent:
    name: Independently compare pinned Lu compiled descriptor and four original JUnits
    needs: [native]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cognitum-lu-ipc01a-r1-*
          path: original-native-evidence
          merge-multiple: false
      - name: Compare original exact SHA, pinned blobs, actual compiled binary and JUnit case IDs
        shell: bash
        env:
          QUALIFIED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,xml.etree.ElementTree as ET
          root=Path("original-native-evidence")
          wanted={f"cognitum-lu-ipc01a-r1-{system}-py{py}"
                  for system in ("ubuntu-latest","windows-latest")
                  for py in ("3.11","3.13")}
          assert {d.name for d in root.iterdir() if d.is_dir()}==wanted
          locks=["4e01d921197fb1c58c99958479b1cede36e13c9a","ac57eb0afc4b2f0630531470e067461d8e2268ea","b21612457c3763dab8233d0eced5e5fffca968ad","300300b9f63f417afcc0ec650697e3012b7bdab0","405fa91935f62226ab0d1a2f0d8b7313e2327116","2f8ccf40e7f1ead28edd3a1ffaee767b6e63b9a7","8db687bd4912f92af3b505088e7683ca0df2a9b2","05e40e09c7a3e9bfdf838d38f4e971682ec8cfd2","64ca56b974d8b0d0b5e3d566e8c0c5bab36ee474","11b7f7072328ff6a1ba8636c44eb1843d212e3d3","1c1d1c6c6d225457c188c705b5ce716fd20d870c"]
          first=None
          receipts={}
          for folder in sorted(root.iterdir()):
              assert (folder/"lu-ipc01a-r1-source-sha.txt").read_text().strip()==os.environ["QUALIFIED_SHA"]
              assert (folder/"lu-ipc01a-r1-source-blobs.txt").read_text().splitlines()==locks
              comp=json.loads((folder/"lu-ipc-v0-compile.json").read_text())
              assert comp["source_git_blob"]=="4e01d921197fb1c58c99958479b1cede36e13c9a"
              assert comp["contract_compiled"] is True
              assert comp["installed_lu_host_connection_qualified"] is False
              assert hashlib.sha256((folder/"lu-ipc-v0.desc").read_bytes()).hexdigest()==comp["descriptor_sha256"]
              py_src=(folder/"cognitum/mel/vendor/lu/workspace/v0/workspace_pb2.py")
              assert py_src.is_file()
              assert hashlib.sha256(py_src.read_bytes()).hexdigest()==comp["python_generated_sha256"]
              cases=list(ET.parse(folder/"lu-ipc01a-r1-native.xml").getroot().iter("testcase"))
              assert len(cases)==30,(folder.name,len(cases))
              assert not any(x.find(tag)is not None for x in cases for tag in ("error","failure","skipped"))
              names=sorted((x.get("classname"),x.get("name")) for x in cases)
              assert len(set(names))==len(names)
              baseline=(names,comp["descriptor_sha256"],comp["python_generated_sha256"])
              if first is None:first=baseline
              else:assert first==baseline
              receipts[folder.name]=dict(passed=len(cases),lu_proto_git_blob=comp["source_git_blob"],
                   descriptor_sha256=comp["descriptor_sha256"])
          output=dict(schema="cognitum.lu_ipc01a_r1.original_native_contract_evidence.v1",
                      status="PASS_NATIVE_PINNED_PROTO_AND_SYNTHETIC_AUTH_HEALTH",
                      qualified_sha=os.environ["QUALIFIED_SHA"],native_receipts=receipts,
                      exact_lu_git_blob_identity=True,original_11_git_hashes_identical=True,
                      original_30_junit_ids_identical=True,compiled_binary_descriptor_identical=True,
                      synthetic_handshake_only=True,live_lu_core_health_qualified=False,
                      os_peer_installed_qualified=False,model_tool_invocation_authorized=False,
                      lu_core_changes_made=False)
          Path("lu-ipc01a-r1-independent.json").write_text(json.dumps(output,sort_keys=True,indent=2)+"\n")
          print(json.dumps(output,sort_keys=True))
          PY
      - name: Preserve original fifth-job independent comparison receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitum-lu-ipc01a-r1-independent
          path: lu-ipc01a-r1-independent.json
          if-no-files-found: warn
