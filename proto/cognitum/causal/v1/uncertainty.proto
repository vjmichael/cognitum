syntax = "proto3";
package cognitum.causal.v1;
// G8 offline evaluation contracts only: NOT a Lu-authorized capability.
// Identification uncertainty (bounds) and sampling uncertainty (envelopes)
// must remain distinct in all UI and LLM-visible interpretations.
message BinaryObservation {
  bool covariate = 1;
  bool treatment = 2;
  bool outcome = 3;
}
message CausalUncertaintyRequest {
  uint32 schema_version = 1;
  string fixture_id = 2;
  string trace_id = 3;
  repeated BinaryObservation observations = 4;
  double confidence = 5;
  uint32 minimum_cell_count = 6;
  bool synthetic_oracle_available = 7;
  double synthetic_oracle_ate = 8;
  // This is a caller declaration, NOT proof of unconfoundedness.
  bool known_hidden_confounder = 9;
}
message CausalPartialBounds {
  double identified_lower_plugin = 1;
  double identified_upper_plugin = 2;
  double population_envelope_lower = 3;
  double population_envelope_upper = 4;
  double conservative_envelope_confidence = 5;
  bool causal_point_identified = 6;
  string identification_assumptions = 7;
  string sampling_assumptions = 8;
}
message CausalPointInterval {
  double estimate = 1;
  double lower = 2;
  double upper = 3;
  double standard_error = 4;
  double nominal_confidence = 5;
  string method = 6;
  bool causal_assumptions_verified = 7;
  bool point_interval_available = 8;
  string reason_code = 9;
}
message CausalUncertaintyResult {
  uint32 schema_version = 1;
  bytes request_sha256 = 2;
  string fixture_id = 3;
  string trace_id = 4;
  CausalPartialBounds partial_identification = 5;
  CausalPointInterval point_interval = 6;
  bool hidden_confounder_declared = 7;
  bool causal_identification_proven = 8; // ALWAYS FALSE
  bool research_only = 9; // ALWAYS TRUE
  string warning = 10;
}
message CausalUncertaintyReceipt {
  bytes request_sha256 = 1;
  bytes result_sha256 = 2;
  bool deterministic_replay_checked = 3;
  bool causal_conclusion_verified = 4; // ALWAYS FALSE
  bool authenticated_host_checked = 5; // ALWAYS FALSE
}
