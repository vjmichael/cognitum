syntax = "proto3";
package cognitum.causal.v1;
import "cognitum/causal/v1/scm.proto";
// C14 P4B exact finite time-unrolled structural model under EXPLICIT assumptions.
// do-interventions are purely mathematical and never execute physical actions.
enum TimeSCMOperation {
  TIME_SCM_OPERATION_UNSPECIFIED = 0;
  TIME_SCM_OBSERVATIONAL = 1;
  TIME_SCM_INTERVENTIONAL = 2;
  TIME_SCM_COUNTERFACTUAL = 3;
}
enum TimeSCMStatus {
  TIME_SCM_STATUS_UNSPECIFIED = 0;
  TIME_SCM_COMPUTED = 1;
  TIME_SCM_REJECTED = 2;
  TIME_SCM_INCONCLUSIVE = 3;
  TIME_SCM_IMPOSSIBLE_EVIDENCE = 4;
}
message LaggedParent {
  uint32 variable = 1; // index in template list
  uint32 lag = 2; // 0: same time earlier variable; 1: preceding time step
}
message TimedState {
  uint32 variable = 1;
  uint32 time = 2; // zero-indexed step
  uint32 state = 3;
}
message TimeSCMVariable {
  string id = 1;
  repeated string states = 2;
  repeated uint32 initial_probability_ppm = 3; // direct initial-value distribution
  repeated string innovation_states = 4;
  repeated uint32 innovation_probability_ppm = 5;
  repeated LaggedParent parents = 6; // explicit order for transition table
  repeated uint32 transition_outputs = 7; // flattened parent then innovation states
}
message TimeSCMRequest {
  uint32 schema_version = 1;
  string trace_id = 2;
  string assumption_id = 3;
  uint32 steps = 4; // 2..4
  repeated TimeSCMVariable variables = 5;
  TimeSCMOperation operation = 6;
  TimedState target = 7; // state ignored; target variable and time selected
  repeated TimedState factual_evidence = 8;
  TimedState intervention = 9; // only if interventional/counterfactual
  uint32 max_exogenous_assignments = 10;
  uint32 timeout_ms = 11;
}
message TimeSCMResult {
  uint32 schema_version = 1;
  bytes request_sha256 = 2;
  bytes unrolled_model_sha256 = 3;
  string trace_id = 4;
  TimeSCMStatus status = 5;
  string reason_code = 6;
  repeated CausalProbabilityCell posterior = 7;
  repeated CounterfactualJointCell counterfactual_joint = 8;
  string factual_evidence_probability = 9;
  bool finite_model_verified = 10; // within assumed time-SCM only
  bool real_world_causation_proven = 11; // ALWAYS FALSE
  string assumptions_and_limits = 12;
  uint64 wall_ns = 13;
}
message TimeSCMReceipt {
  bytes request_sha256 = 1;
  bytes result_sha256 = 2;
  bool exact_model_replay = 3;
  bool causal_structure_verified = 4; // ALWAYS FALSE
  string reason_code = 5;
}
