syntax = "proto3";
package cognitum.spatial.v1;
import "cognitum/spatial/v1/composition.proto";
// C15 T2 P2N: finite, research-only taxonomy/disjointness consistency subset.
// This is NOT full OWL 2, OWL RL, RDFS, sensor authentication, or action authority.
message OntologyClass {
  string class_id = 1;
  repeated string parent_class_ids = 2;
  string source_ref = 3;
}
message OntologyDisjoint {
  string first_class_id = 1;
  string second_class_id = 2;
  string source_ref = 3;
}
message OntologyRelationTypeRule {
  StructureRelation relation = 1;
  string from_class_id = 2;
  string to_class_id = 3;
  string source_ref = 4;
}
message OntologyTypeClaim {
  string node_id = 1;
  string class_id = 2;
  StructureEvidence evidence = 3;
  string source_ref = 4;
}
message OntologyAuditRequest {
  uint32 schema_version = 1;
  string conversation_id = 2;
  StructureGraph graph = 3;
  repeated OntologyClass classes = 4;
  repeated OntologyDisjoint disjoints = 5;
  repeated OntologyTypeClaim assertions = 6;
  bool include_hypotheses = 7;
  bool research_only = 8;
  bool grants_authority = 9;
  repeated OntologyRelationTypeRule relation_rules = 10;
}
message OntologyTypeEntailment {
  string class_id = 1;
  repeated string support_sources = 2;
  bool hypothetical = 3;
}
message OntologyNodeFinding {
  string node_id = 1;
  repeated OntologyTypeEntailment entailed_types = 2;
  repeated string disjoint_conflicts = 3;
  bool conflicted = 4;
  bool hypothetical = 5;
}
message OntologyAuditResult {
  uint32 schema_version = 1;
  string conversation_id = 2;
  string graph_id = 3;
  bytes graph_sha256 = 4;
  bytes request_sha256 = 5;
  repeated OntologyNodeFinding findings = 6;
  repeated string warnings = 7;
  bool research_only = 8;
  bool grants_authority = 9;
  bool consistent_with_claimed_evidence = 10;
}
