syntax = "proto3";
package cognitum.memory.v1;

// Strict native proposals. Neither message is an authorization grant.
// Lu canonical ANSF remains the only owner of durable memory and scope.
message MemoryQuery {
  string scope = 1;
  string text = 2;
  string subject = 3;
  uint32 evidence_limit = 4;
  int64 as_of_unix_ms = 5;
  string expected_snapshot_id = 6;
  uint64 expected_origin_revision = 7;
}

message MemoryEvidence {
  string source_id = 1;
  uint64 revision = 2;
  string access_scope = 3;
  string subject = 4;
  string text = 5;
  string citation_handle = 6;
  int64 valid_from_unix_ms = 7;
  optional int64 valid_until_unix_ms = 8;
}

message MemoryResult {
  repeated MemoryEvidence evidence = 1;
  string snapshot_id = 2;
  uint64 origin_revision = 3;
  bool staleness = 4;
}

enum ClaimOrigin {
  CLAIM_ORIGIN_UNSPECIFIED = 0;
  USER_DECISION = 1;
  IMPORTED_CLAIM = 2;
  MODEL_HYPOTHESIS = 3;
}

enum StateAction {
  STATE_ACTION_UNSPECIFIED = 0;
  ASSERT = 1;
  CONFIRM = 2;
  CHALLENGE = 3;
  SUPERSEDE = 4;
  RETRACT = 5;
  EXPIRE = 6;
}

message StateEvent {
  string event_id = 1;
  string entity = 2;
  string predicate = 3;
  // Typed value is an exact discriminated scalar, never arbitrary JSON.
  oneof value {
    string text_value = 4;
    sint64 integer_value = 5;
    bool bool_value = 6;
  }
  ClaimOrigin origin = 7;
  string actor_authority = 8; // Opaque host-supplied provenance, not a grant.
  uint64 expected_revision = 9;
  int64 effective_unix_ms = 10;
  int64 recorded_unix_ms = 11;
  StateAction action = 12;
  string source_id = 13;
  string scope = 14; // Must match independent host authorization.
}

message BeliefRecord {
  string entity = 1;
  string predicate = 2;
  oneof value {
    string text_value = 3;
    sint64 integer_value = 4;
    bool bool_value = 5;
  }
  ClaimOrigin origin = 6;
  string status = 7;
  uint64 revision = 8;
  repeated string source_refs = 9;
  repeated string conflict_refs = 10;
  string last_event_id = 11;
}
