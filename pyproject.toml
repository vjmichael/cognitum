[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitum-core"
version = "0.1.0"
description = "Experimental cognitive augmentation foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Core remains stdlib-only. A native Lu Protobuf CE requires this optional extra.
proto = ["protobuf>=6.31,<8"]
# Optional offline verifier dependencies; no OS worker is started by these.
security = ["protobuf>=6.31,<8", "cryptography>=44,<47"]

[tool.setuptools.packages.find]
include = ["cognitum*"]
