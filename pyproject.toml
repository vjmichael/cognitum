[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitum-core"
version = "0.1.0"
description = "Experimental cognitive augmentation foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Core remains stdlib-only. A native Lu Protobuf CE requires this optional extra.
proto = ["protobuf>=6.31,<8"]
# Optional offline verifier dependencies; no OS worker is started by these.
security = ["protobuf>=6.31,<8", "cryptography>=44,<47"]
# Optional offline high-precision scientific numerics; no SymPy string eval.
scientific = ["protobuf>=6.31,<8", "mpmath>=1.3,<2"]
# C08/C09 optional CPU-only research adapters; never installed by default.
research-hdc-kan = ["protobuf>=6.31,<8", "numpy>=1.26,<3"]

# C12 graph planner uses mature NetworkX; never needed by Cognitum core.
planning-graph = ["protobuf>=6.31,<8", "networkx>=3.3,<4"]
# Optional independent conventional plan validator (Apache-2.0 library).
planning-validation = ["protobuf>=6.31,<8", "unified-planning>=1.3,<2"]

# C14 production-target maintained causal-library adapters; never auto-launch.
causal-stats = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.10,<2", "statsmodels>=0.14,<0.16"]
causal-dowhy = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "pandas>=2,<3", "dowhy>=0.13,<1"]
causal-econml = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "econml>=0.16,<0.18"]
causal-discovery = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "causal-learn>=0.1.4,<0.2"]
# GPLv3+: manual host review; no default product distribution.
causal-timeseries-gpl = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "tigramite>=5.2,<6"]


# Combined-tree specialist extras; base Cognitum core remains stdlib-only.
adaptation-classical = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2"]
formal-cvc5 = ["protobuf>=6.31,<8", "cvc5>=1.2,<2"]
formal-z3 = ["protobuf>=6.31,<8", "z3-solver>=4.12,<5"]
optimization-mip = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2"]
optimization-schedule = ["protobuf>=6.31,<8", "ortools>=9.12,<10"]
physics-ode = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2"]
probability-stats = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2"]
spatial-core = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2"]
spatial-vision = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2", "opencv-python-headless>=4.9,<5", "pillow>=10,<13"]
temporal-learned = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2"]
temporal-statespace = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2"]
topology-rips = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2", "ripser>=0.6.12,<0.7", "persim>=0.3.8,<0.5", "scikit-learn>=1.5,<2"]
topology-verify = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "scipy>=1.14,<2", "ripser>=0.6.12,<0.7", "persim>=0.3.8,<0.5", "scikit-learn>=1.5,<2", "gudhi>=3.13,<3.14"]

[tool.setuptools.packages.find]
include = ["cognitum*"]
