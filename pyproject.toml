[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitum-core"
version = "0.1.0"
description = "Experimental cognitive augmentation foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Core remains stdlib-only. A native Lu Protobuf CE requires this optional extra.
proto = ["protobuf>=6.31,<8"]
# Optional offline verifier dependencies; no OS worker is started by these.
security = ["protobuf>=6.31,<8", "cryptography>=44,<47"]
# Optional offline high-precision scientific numerics; no SymPy string eval.
scientific = ["protobuf>=6.31,<8", "mpmath>=1.3,<2"]
# C08/C09 optional CPU-only research adapters; never installed by default.
research-hdc-kan = ["protobuf>=6.31,<8", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["cognitum*"]
