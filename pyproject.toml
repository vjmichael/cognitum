[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitum-core"
version = "0.1.0"
description = "Cognitum heterogeneous cognitive augmentation: HDC, KAN, SSM and established specialists"
requires-python = ">=3.11"
# One Cognitum distribution. HDC, KAN and SSM are installed together with the
# existing first-party modules; no separate researcher/specialist wheel.
dependencies = ["protobuf>=6.31,<8", "numpy>=1.26,<3", "cryptography>=44,<47"]

[project.optional-dependencies]
# Compatibility aliases ONLY, not separate distributions. All three kernels
# and checkpoint verification dependencies already ship in cognitum-core.
research-hdc-kan = []
research-hdc-kan-verified = []
proto = []
security = []
scientific = ["mpmath>=1.3,<2"]

[tool.setuptools.packages.find]
include = ["cognitum*"]
