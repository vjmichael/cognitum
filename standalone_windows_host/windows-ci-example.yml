# Optional template, not installed or dispatched by ChatGPT.
# Place in .github/workflows/ in an ISOLATED validation repository if desired.
name: Cognitum P2Z standalone Windows host-validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'standalone_windows_host/**'
      - 'tests/test_c15_t3_windows_host_harness.py'
jobs:
  windows-process-validation:
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r standalone_windows_host/requirements.txt
      - name: Verify x64 / NTFS / subprocess restart gates
        shell: pwsh
        run: ./standalone_windows_host/Run-Windows-Host-Gates.ps1 -Python python -EvidenceDirectory ./windows-host-evidence
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitum-windows-process-validation
          path: windows-host-evidence/**
          if-no-files-found: warn
